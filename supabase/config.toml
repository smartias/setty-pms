# Supabase project configuration.
#
# Supabase's GitHub integration only handles the edge functions declared here,
# and declaring one does TWO things:
#
#   1. Every pull request's preview branch builds it, so a function that does
#      not compile fails the PR ("Supabase Preview" check) instead of being
#      found at deploy time.
#   2. Every merge to main DEPLOYS IT TO PRODUCTION ("Deploy to production" is
#      on), after applying any new migration files. If the migration step
#      fails, the function deploy is skipped; see CLAUDE.md, "Edge function
#      deploys".
#
# So: list a function only when main is what should be running. A function that
# is not listed is untouched by merges and deploys only by hand.
#
# The automatic deploy has no health check. Each function except unsubscribe
# also has a "Deploy <name>" workflow that redeploys it and verifies the
# result; run one when a change needs confirming.
#
# Keep this file to the function declarations. Anything else added here (auth,
# api, storage, db) becomes configuration-as-code for the preview branches.
#
# verify_jwt must match how each function is meant to run: these are the
# values a merge to main deploys with (and must match the --no-verify-jwt
# flags in the Deploy workflows).

# A local identifier for the CLI (docker names), not the hosted project ref.
project_id = "setty-pms"

# The PMS connector (MCP). Does its own auth (Microsoft sign-in or the shared
# secret), so Supabase's JWT gate must stay off or every client breaks.
# Production deploy: .github/workflows/deploy-pms-mcp.yml (--no-verify-jwt).
[functions.pms-mcp]
verify_jwt = false

# In-app proposal drafting. Keeps Supabase's JWT gate: only signed-in suite
# users reach it. Production deploy: .github/workflows/deploy-proposal-draft.yml.
[functions.proposal-draft]
verify_jwt = true

# Welcome and weekly digest email (the digest runs Monday mornings from
# pg_cron). JWT gate off because a browser CORS preflight cannot carry a JWT;
# every route checks its caller itself.
# Production deploy: .github/workflows/deploy-pms-user-emails.yml (--no-verify-jwt).
[functions.pms-user-emails]
verify_jwt = false

# Newsletter unsubscribe API, called by Unsubscribe.html. Public: recipients
# arrive from an email link with no sign-in, so the JWT gate must stay off.
[functions.unsubscribe]
verify_jwt = false
