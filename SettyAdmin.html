<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setty — Admin Console</title>
<style>
  :root {
    --bg: #0b1120; --card: #101a30; --card2: #0d1526; --border: #1e2a44;
    --text: #e2e8f0; --dim: #94a3b8; --muted: #8b98ab;
    --accent: #3b82f6; --accent-dim: #14233f;
    --green: #34d399; --greenDim: #0a2b22; --red: #f87171; --redDim: #3b1219;
    --amber: #fbbf24; --amberDim: #33270a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 26px 70px; background: var(--bg); color: var(--text);
         font: 14px/1.55 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0; }
  a { color: var(--accent); text-decoration: none; }
  .header-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .header-sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .chip { border: 1px solid var(--border); background: var(--card); border-radius: 999px;
          padding: 6px 14px; color: inherit; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .chip:hover { border-color: var(--accent); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .tab { border: 1px solid var(--border); background: var(--card); color: var(--dim);
         border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase;
       letter-spacing: .4px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--card2); vertical-align: top; }
  tr:hover td { background: var(--card2); }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 11.5px; font-weight: 600; }
  .ok    { background: var(--greenDim); color: var(--green); }
  .bad   { background: var(--redDim);   color: var(--red); }
  .warn  { background: var(--amberDim); color: var(--amber); }
  .info  { background: var(--accent-dim); color: var(--accent); }
  .btn { border: 1px solid var(--border); background: var(--card2); color: var(--text);
         border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-danger:hover { border-color: var(--red); color: var(--red); }
  input, select { background: var(--card2); border: 1px solid var(--border); color: var(--text);
                  border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  input:focus, select:focus { border-color: var(--accent); }
  :focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
             clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stat { display: inline-block; margin-right: 26px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--dim); font-size: 12px; }
  .snapchip { display: inline-block; background: var(--card2); border: 1px solid var(--border);
              border-radius: 6px; padding: 2px 8px; font-size: 11.5px; color: var(--dim); margin: 2px; }
  .gate { max-width: 420px; margin: 12vh auto; text-align: center; }
  .gate .big { font-size: 44px; margin-bottom: 10px; }
  /* System Guide / MCP doc styles */
  pre { background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 12px; font-size: 12px; overflow-x: auto; margin: 8px 0; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--text); word-break: break-all; }
  .sechead { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
  .doc p { margin: 6px 0; color: var(--dim); font-size: 13px; }
  .doc b { color: var(--text); }
  .doc ul, .doc ol { margin: 6px 0 6px 4px; padding-left: 18px; color: var(--dim); font-size: 13px; }
  .doc li { margin: 4px 0; }
  .appgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .appcard { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .appcard h4 { margin: 0 0 4px; font-size: 13.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .applaunch { margin-left: auto; font-size: 11px; font-weight: 600; padding: 3px 10px; border: 1px solid var(--border);
               border-radius: 6px; background: var(--card); color: var(--accent); text-decoration: none; white-space: nowrap; }
  .applaunch:hover { border-color: var(--accent); }
  .appcard p { margin: 0; color: var(--dim); font-size: 12.5px; }
  .appcard .src { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
  .archflow { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .archcol { flex: 1; min-width: 210px; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .archcol h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .architem { border: 1px solid var(--border); background: var(--card); border-radius: 7px; padding: 5px 9px; font-size: 12.5px; margin: 5px 0; }
  .architem span { color: var(--muted); font-size: 11.5px; display: block; }
  .phaserow { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--card2); }
  .phaserow:last-child { border-bottom: none; }
  .phaserow .pill { flex-shrink: 0; margin-top: 1px; }
  .jump { display: inline-block; margin: 2px 6px 2px 0; font-size: 12.5px; }
  #status { min-height: 20px; font-size: 12.5px; margin: 4px 0 10px; }
  #status.error { color: var(--red); } #status.success { color: var(--green); }
  @media (max-width: 720px) { body { padding: 12px 12px 60px; } .stat { margin-right: 16px; } }
</style>
</head>
<body>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Setty Admin Console v12 (v2 added System Guide + Claude/MCP runbook tabs;
// v3 made the whole console ADMIN-ONLY — first Phase 5 slice;
// v4 adds the Phase 5 backbone: 7-role taxonomy, the role×capability

// v5 adds last-admin/self-demote guards on role changes, a confirm on
// override removal, and the pre-Phase-4 warning banner on the matrix;
// v6 updates the System Guide Security section + matrix notes for the
// executed Phase 4 flip and the Phase 5 enforcement rollout;
// v7 brings the Claude/MCP runbook current: server v31 + the OAuth
// resource/scope fix, the local Python bridge marked deprecated, and a
// dated status card so the tab can be handed to IT as-is;
// v8 (2 Aug 2026) brings both status surfaces current again: the connector
// at deploy 45 / build 2026-08-02-issue-date with 23 tools (documents,
// drawings and briefing groups added since v31), the deploy procedure
// corrected now that the source is committed to the repo rather than
// pulled back off the live function, and the Phase 5 Security section
// updated to say which capabilities are actually DB-enforced today;
// v9 (2 Aug 2026) fixes the step that this integration keeps stalling on:
// adding the connector is Organization settings -> Connectors and is
// restricted to a Claude OWNER or Primary Owner, not an Admin, and the
// section is simply absent for other roles rather than disabled — which
// reads as a missing feature. The steps now say who does which half,

// before the blame lands on it, note that a 404 on

// v10 (5 Aug 2026) RETRACTS the v9 claim that the 404 on
// /.well-known/oauth-authorization-server is expected and not worth
// chasing. That 404 is the fault. Entra publishes only
// openid-configuration and returns 404 at all three RFC 8414 locations,
// so Claude finds no authorization-server metadata, derives
// <origin>/authorize from the connector URL, and lands on Supabase's
// "requested path is invalid". The discovery proxy in mcp-proxy/ answers
// that document. Also records that the connector app's client secret is
// now SPLIT in two, because one secret backing both the connector and
// app-only Graph reading meant rotating it silently broke documents.
// v11 (5 Aug 2026, evening) records the first WORKING end-to-end OAuth
// sign-in and the third stacked bug that fell to get there: the Entra app
// manifest had api.requestedAccessTokenVersion null, so Microsoft issued
// v1-format tokens whose issuer (sts.windows.net) fails the server's
// v2-only check, and every initialize got 401. The visible symptom was
// claude.ai reporting "This connector has no tools available" while
// silently retrying initialize. Set to 2 in the manifest, and documented
// here as an invariant. Also RETRACTS the v9 claim that this tenant
// blocks all user self-consent: the first real sign-in (5 Aug) consented
// user-side with no admin involved, so AADSTS65001 is a possible state,
// not the expected one. Adds the no-tools troubleshooting entry, the
// enumerate-at-add rule, and the wrangler-tail debugging method.
// v12 (16 Aug 2026) adds System Guide section 7, Document templates, which
// explains why generated documents used to come out with the wrong fonts
// and no letterhead: get_template returns TEXT, and the letterhead lives in
// .docx parts (the 471 KB logo, header1.xml, styles.xml, numbering.xml)
// that never travel in a text payload, so the model was redrawing the
// document from a skeleton every time. Documents the fix (substitute inside
// a copy of the real .docx), where the canonical vs tokenized copies live,
// how to regenerate after editing a template, and the traps — chiefly that
// counting replacements is NOT verification, since an early build reported
// 12/12 replaced while having silently destroyed 6 tokens. Also corrects
// the Knowledge-layer bullet that implied dropping a file in the templates
// folder was sufficient on its own.
// The gate is enforced server-side, not just cosmetically: the admin_* RPCs
// raise 'Admin role required' unless the caller's JWT email has role='admin'
// in pms_user_roles, and that table + pms_settyfy_map carry admin-only RLS
// (is_pms_admin()). The page checks my_pms_role() after sign-in for UX.
// ─────────────────────────────────────────────────────────────────────────────
const SUPABASE_URL  = "https://khxmgjilwhdguuepbhne.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoeG1namlsd2hkZ3V1ZXBiaG5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjg2MDYsImV4cCI6MjA4ODY0NDYwNn0.vtHt2eydU2iQ426iYOzLrqpH2WLXdRnicq-3sNfoNq8";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function toast(msg, kind) { const el = $("status"); el.className = kind || ""; el.textContent = msg; if (kind === "success") setTimeout(() => { el.textContent = ""; el.className = ""; }, 3500); }

async function sb(method, path, body, prefer) {
  const headers = {
    "apikey": SUPABASE_ANON,
    "Authorization": "Bearer " + settyAuth.token(),
    "Content-Type": "application/json",
    "Prefer": "return=representation" + (prefer ? "," + prefer : ""),
  };
  const res = await fetch(SUPABASE_URL + path, { method, headers, ...(body !== undefined ? { body: JSON.stringify(body) } : {}) });
  if (!res.ok) throw new Error(method + " " + res.status + ": " + (await res.text()).slice(0, 250));
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

const rel = (iso) => {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
};

const TABS = [
  { key: "signins", label: "👥 Sign-ins" },
  { key: "roles",   label: "🔑 Users & Roles" },
  { key: "backups", label: "🗄️ Backups" },
  { key: "filing",  label: "📨 Filing Log" },
  { key: "integration", label: "🔗 Integration" },
  { key: "library", label: "📚 Proposal Library" },
  { key: "guide", label: "📖 System Guide" },
  { key: "mcp",   label: "🤖 Claude / MCP" },
];
const state = { tab: "signins", roster: null, staffCount: null, roles: null, backups: null, filing: null, filingFilter: "all",
                integ: null, integProjects: null, integMaps: null, integFilter: "", tokenShown: false, feedTest: null,
                sovOpen: null, sovMaps: null, sovMilestones: {},
                permCatalog: null, permMatrix: null, permOverrides: null,
                lib: null, libEditKey: null, libNew: false, libClients: null, libClientQ: "", libClientSel: null,
                myRole: undefined };   // undefined = not checked · "pending" · "none" · or a ROLES value

// Phase 5 role taxonomy. 'staff' is the baseline for signed-in people without
// a registry row — keep it last in lists but never remove it.
const ROLES = ["admin", "project_manager", "engineer", "operations", "accounting", "contracts", "marketing", "qaqc", "staff"];
const ROLE_COLOR = { admin: "bad", project_manager: "warn", engineer: "ok", operations: "info",
                     accounting: "warn", contracts: "info", marketing: "info", qaqc: "ok", staff: "info" };
const roleLabel = (r) => r === "qaqc" ? "QA/QC" : r.replace("_", " ");
const roleOpts = (sel) => ROLES.map(o => `<option value="${o}" ${o === sel ? "selected" : ""}>${roleLabel(o)}</option>`).join("");

// ── SharePoint onboarding (Graph sharing invitations) ────────────────────────
// Grants a new person access to the NYCProjects document libraries by inviting
// them on each library ROOT (Files.ReadWrite.All — already consented; no new
// IT approvals). Uses the same c4739c11 registration as the PMS, so its MSAL
// token cache is shared — if the admin has used the PMS in this browser the
// token is acquired silently. Teams team membership (project channels/OneNote
// notebooks) still needs a Teams owner: that Graph write scope isn't granted.
const SP_DRIVES = [
  { label: "Project Document Library", id: "b!ZARYqukTtE6K1Mpv9bngAehneskb-yNKopp1Ol1X1BBnJPKsNGM-TaGmbGiL3ZaU" },
  { label: "Proposals",                id: "b!ZARYqukTtE6K1Mpv9bngAehneskb-yNKopp1Ol1X1BD05MwIg6LcTbBQFEDE4JKC" },
  { label: "Contracts",                id: "b!ZARYqukTtE6K1Mpv9bngAehneskb-yNKopp1Ol1X1BDwTLUC_kC6TYDhC8BfQTMb" },
];
let _msalApp = null;
async function graphToken(interactiveOk) {
  if (!window.msal) throw new Error("MSAL script not loaded");
  if (!_msalApp) {
    _msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: "c4739c11-e89b-4a04-9580-f2d886356301",
        authority: "https://login.microsoftonline.com/f374c024-71c2-48b6-8420-076fff97327c",
        // Must be a registered redirect URI — the PMS page is; this console isn't.
        // MSAL's popup flow only reads the hash off that URL, so it works fine.
        redirectUri: "https://smartias.github.io/setty-pms/SettyPMS.html",
      },
      cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false },
      system: { allowNativeBroker: false },
    });
    await _msalApp.initialize();
  }
  const scopes = ["User.Read", "Files.ReadWrite.All"];
  const account = _msalApp.getAllAccounts()[0];
  if (account) {
    try { return (await _msalApp.acquireTokenSilent({ scopes, account })).accessToken; }
    catch (e) { if (!interactiveOk) throw e; }
  } else if (!interactiveOk) {
    throw new Error("no cached Microsoft session");
  }
  const res = await _msalApp.loginPopup({ scopes });
  return res.accessToken;
}
// Returns { granted: [lib…], failed: [{lib, error}…] }
async function grantSpAccess(email, interactiveOk) {
  const token = await graphToken(interactiveOk);
  const granted = [], failed = [];
  for (const d of SP_DRIVES) {
    const invite = async (sendInvitation) => fetch(
      "https://graph.microsoft.com/v1.0/drives/" + d.id + "/root/invite", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({
          recipients: [{ email }], requireSignIn: true, sendInvitation,
          roles: ["write"], message: "You've been onboarded to the Setty PMS — this grants access to the NYCProjects libraries.",
        }),
      });
    try {
      let res = await invite(false);                      // silent direct grant first
      if (!res.ok) res = await invite(true);              // fall back to a sharing-mail invite
      if (res.ok) granted.push(d.label);
      else failed.push({ lib: d.label, error: res.status + " " + (await res.text()).slice(0, 120) });
    } catch (e) { failed.push({ lib: d.label, error: e.message }); }
  }
  return { granted, failed };
}
// Inline button feedback. The #status toast sits at the top of the page and is
// easy to miss when the roster is scrolled down (reported 2026-08-04), and the
// button gave no sign it had done anything. So async row actions now show their
// state ON the button: ⏳ while running, ✓ on success, ✗ on failure (full error
// in the button's tooltip). These handlers don't re-render the table, so the
// button survives long enough to show the result. toast() stays as the detailed
// secondary channel for anyone who scrolls up.
async function withBtn(btn, workingLabel, okLabel, fn) {
  const orig = btn ? { html: btn.innerHTML, title: btn.title } : null;
  const clearStyle = () => { btn.style.opacity = ""; btn.style.background = ""; btn.style.color = ""; btn.style.borderColor = ""; };
  if (btn) { btn.disabled = true; btn.style.opacity = "0.7"; btn.textContent = "⏳ " + workingLabel; }
  const restore = (ms) => setTimeout(() => { if (!btn) return; clearStyle(); btn.innerHTML = orig.html; btn.title = orig.title; btn.disabled = false; }, ms);
  try {
    const r = await fn();
    if (btn) { clearStyle(); btn.textContent = "✓ " + okLabel; btn.style.background = "var(--greenDim)"; btn.style.color = "var(--green)"; btn.style.borderColor = "var(--green)"; restore(2600); }
    return r;
  } catch (e) {
    const msg = (e && e.message) ? e.message : String(e);
    if (btn) { clearStyle(); btn.textContent = "✗ failed"; btn.style.background = "var(--redDim)"; btn.style.color = "var(--red)"; btn.style.borderColor = "var(--red)"; btn.title = msg; restore(6000); }
    toast(msg, "error");
    return null;
  }
}
async function sendWelcomeForRow(btn, email, role, display_name) {

}
async function grantSpForRow(btn, email) {

}
const FEED_URL = SUPABASE_URL + "/functions/v1/pms-billing-feed/v1/pms/billable-milestones";

// ── Rendering ────────────────────────────────────────────────────────────────
function render() {
  // Rebuilding #view via innerHTML destroys the focused element (e.g. the
  // project filter input re-renders on every keystroke). Capture the focused
  // element's id and caret here; restore after the rebuild at the bottom.
  const _active = document.activeElement;
  const _focusId = _active && _active.id ? _active.id : null;
  let _selStart = null, _selEnd = null;
  if (_focusId) { try { _selStart = _active.selectionStart; _selEnd = _active.selectionEnd; } catch (_) {} }
  const signedIn = settyAuth.isSignedIn();
  $("userChip").textContent = signedIn ? "✓ " + settyAuth.email() : "Sign in";
  $("userChip").onclick = signedIn
    ? () => { if (confirm("Sign out of " + settyAuth.email() + "?")) settyAuth.signOut().then(render); }
    : () => settyAuth.signInWithMicrosoft();

  if (!signedIn) {
    state.myRole = undefined;
    $("tabs").style.display = "none";
    $("view").innerHTML = `
      <div class="gate card">
        <div class="big">🛠️</div>
        <h2 style="margin:0 0 6px">Admin Console</h2>
        <p style="color:var(--dim)">This page requires a Setty sign-in with the <b>admin</b> role.</p>
        <button class="btn btn-primary" onclick="settyAuth.signInWithMicrosoft()" style="width:100%;padding:11px">Sign in with Microsoft</button>
      </div>`;
    return;
  }
  // Admin gate. The database enforces this regardless (guarded RPCs + RLS);
  // this check just gives non-admins a clear screen instead of error toasts.
  if (state.myRole === undefined) {
    state.myRole = "pending";
    sb("POST", "/rest/v1/rpc/my_pms_role", {})
      .then(r => { state.myRole = r || "none"; render(); })
      .catch(e => { state.myRole = "none"; toast("Role check failed: " + e.message, "error"); render(); });
  }
  if (state.myRole === "pending") {
    $("tabs").style.display = "none";
    $("view").innerHTML = '<div class="empty">Checking access…</div>';
    return;
  }
  if (state.myRole !== "admin") {

async function toggleCap(role, cap, allowed) {
  try {
    await sb("PATCH", "/rest/v1/pms_role_permissions?role=eq." + encodeURIComponent(role) +
      "&capability=eq." + encodeURIComponent(cap),
      { allowed, updated_at: new Date().toISOString(), updated_by: settyAuth.email() });
    const cell = state.permMatrix.find(x => x.role === role && x.capability === cap);
    if (cell) cell.allowed = allowed;
    toast(role.replace("_", " ") + " · " + cap + " → " + (allowed ? "allowed" : "denied"), "success");
  } catch (e) { toast(e.message, "error"); state.permMatrix = null; render(); }
}
async function addOverride() {
  const proj = $("ovProj").value.trim().toUpperCase() || null;
  const kind = $("ovKind").value;
  const subject = kind === "everyone" ? null : $("ovSubject").value.trim().toLowerCase();
  if (kind === "user" && !/@setty\.com$/.test(subject || "")) { toast("Person must be a @setty.com email", "error"); return; }
  if (kind === "role" && !ROLES.includes(subject || "")) { toast("Role must be one of: " + ROLES.join(", "), "error"); return; }
  if (!proj && kind !== "user") { toast("Global rules (blank project) are person-only — pick a project for role/everyone rules.", "error"); return; }
  try {
    await sb("POST", "/rest/v1/pms_project_permissions", {
      project_number: proj, subject_kind: kind, subject,
      capability: $("ovCap").value, allowed: $("ovAllowed").value === "true",
      note: $("ovNote").value.trim() || null, added_by: settyAuth.email(),
    });
    state.permOverrides = null; toast("Override added", "success"); render();
  } catch (e) { toast(e.message, "error"); }
}
async function dropOverride(id) {
  const o = (state.permOverrides || []).find(x => x.id === id);
  if (o) {
    const rule = (o.allowed ? "allow" : "deny") + " · " +
      (o.subject_kind === "everyone" ? "everyone" : (o.subject || o.subject_kind)) + " · " +
      (o.capability === "*" ? "★ all capabilities" : o.capability);
    const scope = o.project_number || "ALL projects (global)";
    if (!confirm('Remove override "' + rule + '" on ' + scope + "? This takes effect immediately.")) return;
  } else if (!confirm("Remove this override? This takes effect immediately.")) return;
  try {
    await sb("DELETE", "/rest/v1/pms_project_permissions?id=eq." + id);
    state.permOverrides = null; toast("Override removed", "success"); render();
  } catch (e) { toast(e.message, "error"); }
}
async function addRole() {
  const email = $("newEmail").value.trim().toLowerCase();
  if (!/@setty\.com$/.test(email)) { toast("Email must be @setty.com", "error"); return; }
  const role = $("newRole").value, display_name = $("newName").value.trim() || null;
  const optInDigest = $("newDigest") && $("newDigest").checked;
  try {
    await sb("POST", "/rest/v1/pms_user_roles", {
      email, role, display_name, added_by: settyAuth.email(),
    }, "resolution=merge-duplicates");
    // Pre-enroll in the Monday digest (admin RLS allows writing others' prefs;
    // self-service in My Projects → ⚙ My Settings overrides later). Only on
    // opt-in, and never downgrades an existing row.
    if (optInDigest) {
      try {
        await sb("POST", "/rest/v1/pms_user_prefs",
          { email, weekly_digest: true, digest_scope: "mine", updated_at: new Date().toISOString() },
          "resolution=merge-duplicates");
      } catch (_) { /* non-fatal — they can opt in themselves */ }
    }
    state.roles = null; render();
    // Welcome email (pms-user-emails fn, Resend). Non-fatal: the row is saved
    // either way — surface the outcome in the toast.
    let mailNote = "";
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/pms-user-emails/welcome", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON,
                   "Authorization": "Bearer " + settyAuth.token() },
        body: JSON.stringify({ email, role, display_name, added_by: settyAuth.email() }),
      });
      const j = await res.json().catch(() => ({}));
      mailNote = res.ok ? " · welcome email sent 📬" : " — welcome email failed: " + (j.error || res.status);
    } catch (e2) { mailNote = " — welcome email failed: " + e2.message; }
    // SharePoint grant — silent attempt only (uses the cached PMS Microsoft
    // session if one exists; never pops a login mid-add). The per-row
    // "📁 SP access" button is the interactive path / retry.
    let spNote = "";
    try {
      const r = await grantSpAccess(email, false);
      spNote = r.failed.length === 0
        ? " · 📁 SharePoint access granted"
        : " · 📁 SP partial (" + r.granted.length + "/" + SP_DRIVES.length + ") — use the row button to retry";
    } catch (_) { spNote = " · 📁 click “SP access” on their row to grant SharePoint"; }
    toast("Added " + email + mailNote + spNote, mailNote.includes("failed") ? "error" : "success");
  } catch (e) { toast(e.message, "error"); }

async function setRole(email, role) {
  const cur = (state.roles || []).find(x => x.email === email);
  const oldRole = cur ? cur.role : null;
  if (oldRole === role) return;
  const admins = (state.roles || []).filter(x => x.role === "admin");
  if (oldRole === "admin" && role !== "admin" && admins.length === 1) {
    toast("That's the last admin — demoting it would lock everyone out of this console.", "error");
    render(); return;
  }
  const isSelf = email === settyAuth.email().toLowerCase();
  if ((oldRole === "admin" && role !== "admin") || isSelf) {
    const who = isSelf ? "YOUR OWN account (" + email + ")" : email;
    if (!confirm("Change " + who + " from " + (oldRole ? roleLabel(oldRole) : "?") + " to " + roleLabel(role) + "?")) {
      render(); return;
    }
  }
  try {
    await sb("PATCH", "/rest/v1/pms_user_roles?email=eq." + encodeURIComponent(email),
      { role, updated_at: new Date().toISOString(), added_by: settyAuth.email() });
    state.roles = null; toast(email + " → " + role, "success"); render();
  } catch (e) { toast(e.message, "error"); }
}
async function dropRole(email) {
  const admins = (state.roles || []).filter(x => x.role === "admin");
  if (admins.length === 1 && admins[0].email === email) {
    toast("That's the last admin — removing it would lock everyone out of this console.", "error"); return;
  }
  if (email === settyAuth.email().toLowerCase() &&
      !confirm("This is YOUR account — removing it locks you out of this console. Continue?")) return;
  if (!confirm("Remove " + email + " from the roles list?")) return;
  try {
    await sb("DELETE", "/rest/v1/pms_user_roles?email=eq." + encodeURIComponent(email));
    state.roles = null; toast("Removed " + email, "success"); render();
  } catch (e) { toast(e.message, "error"); }
}

// ── Fee Schedule of Values mapping (billable milestone → SETTYfy fee line) ───
// Keys on the milestone's stable id, never its name — same pin-to-stable-ID
// rule as the project-level map. fee_at_map snapshots the PMS fee at link
// time so a later fee edit flags the row instead of silently drifting.
const money = (n) => "$" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const feeNum = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };

function sovPanel(p, m) {
  const ms = state.sovMilestones[p.num];
  if (ms === undefined) return '<div class="empty">Loading billable milestones…</div>';
  if (!ms.length) return '<div class="empty">No billable milestones on this project — the fee SOV lives on billable milestones in the PMS. Add them there first.</div>';
  const total = ms.reduce((s, x) => s + feeNum(x.fee), 0);
  const lineMapped = ms.filter(x => (state.sovMaps[p.num + "|" + x.id] || {}).settyfy_line_id).length;
  return `
    <div style="color:var(--muted);font-size:12px;margin-bottom:6px">
      FEE SCHEDULE OF VALUES — map each PMS billable milestone to its SETTYfy fee-schedule line.
      ${m.settyfy_id ? "" : "⚠ Map the project to a SETTYfy ID above first — line links ride the feed but SETTYfy can't anchor them until the project itself is linked."}
    </div>
    <details style="color:var(--muted);font-size:12px;margin-bottom:8px">
      <summary style="cursor:pointer">ℹ How this works — will SETTYfy's values show up here?</summary>
      <ul style="margin:6px 0 2px 18px;line-height:1.5">
        <li><b>The line # is typed in by hand.</b> SETTYfy doesn't expose its fee schedules to PMS yet (no read API on their side), so there's nothing to pick from or match against — copy each line ID straight off SETTYfy's fee-schedule screen for this project, or ask IT/accounting for the list.</li>
        <li><b>PMS never checks amounts against SETTYfy.</b> A mapped line ID simply rides the billing feed (<code>settyfyLineId</code> on each milestone) so SETTYfy can anchor our milestone to their line — the dollar matching and reconciliation happen on their side, against the PMS fee we send.</li>
        <li><b>The ⚠ pill isn't a SETTYfy mismatch.</b> It means the PMS fee changed <i>after</i> you mapped the line — re-save to acknowledge the new amount.</li>
        <li>Once SETTYfy exposes a read API for fee schedules, this hand entry becomes a side-by-side pick-list with their line names and amounts.</li>
      </ul>
    </details>
    <div class="row" style="margin-bottom:6px">
      <div class="stat"><b>${money(total)}</b><span>Σ PMS billable fees</span></div>
      <div class="stat"><b>${lineMapped}/${ms.length}</b><span>lines mapped</span></div>
    </div>
    <table><thead><tr><th>Milestone</th><th>Phase</th><th>Fee (PMS)</th><th>Due</th><th>SETTYfy line #</th><th></th></tr></thead>
    <tbody>${ms.map(x => {
      const sm = state.sovMaps[p.num + "|" + x.id] || {};
      const drift = sm.settyfy_line_id && sm.fee_at_map != null && Math.abs(feeNum(x.fee) - feeNum(sm.fee_at_map)) > 0.005;
      return `<tr><td>${esc(x.name)}</td><td>${esc(x.phase || "")}</td>
        <td>${money(x.fee)}${drift ? ` <span class="pill warn" title="PMS fee changed since this line was mapped — was ${money(sm.fee_at_map)}. Re-save to acknowledge.">⚠ was ${money(sm.fee_at_map)}</span>` : ""}</td>
        <td>${esc(x.dueDate || "")}</td>
        <td><input id="sov_${esc(p.num)}_${esc(x.id)}" aria-label="SETTYfy fee line ID for ${esc(x.name)}" value="${esc(sm.settyfy_line_id || "")}" placeholder="line #…" style="width:110px"></td>
        <td><button class="btn" onclick="saveSovLine('${esc(p.num)}','${esc(x.id)}',${feeNum(x.fee)})">Save</button></td></tr>`; }).join("")}
    </tbody></table>`;
}

// ── System Guide (static explainer — how the whole suite works) ──────────────
// ── Proposal Library (pms_proposal_clauses + client rate schedules) ──────────
// The governed building blocks the PMS clause picker assembles from. Writes
// are RLS-gated on the proposal.library capability (admins pass implicitly).
const LIB_BLOCKS = ["included", "additional", "excluded", "assumptions", "provisions", "understanding", "approach", "other"];
const LIB_STATUS_PILL = { approved: "ok", draft: "warn", retired: "bad" };

async function libLoad() {
  state.lib = await sb("GET", "/rest/v1/pms_proposal_clauses?select=*&order=block.asc,sort.asc&limit=1000");
}
async function libLoadClients() {
  // Only the fields the rates editor needs — id/version for the optimistic
  // write, name + rateSchedule/notes read out of the client jsonb.
  state.libClients = await sb("GET", "/rest/v1/pms_clients?select=id,version,client&order=id.asc&limit=1000");
}
function libClauseByKey(key) { return (state.lib || []).find(c => c.clause_key === key) || null; }

async function libSaveClause(existingKey) {
  const val = (id) => ($(id) ? $(id).value : "");
  let params;
  try { params = val("lib-params").trim() ? JSON.parse(val("lib-params")) : {}; }
  catch (e) { toast("Params must be valid JSON: " + e.message, "error"); return; }
  const row = {
    clause_key: val("lib-key").trim(),
    block: val("lib-block"),
    title: val("lib-title").trim(),
    body_html: val("lib-body"),
    params,
    sort: Number(val("lib-sort")) || 100,
    status: val("lib-status"),
  };
  if (!row.clause_key || !row.title) { toast("Key and title are required.", "error"); return; }
  try {
    if (existingKey) {
      const cur = libClauseByKey(existingKey);
      await sb("PATCH", "/rest/v1/pms_proposal_clauses?id=eq." + cur.id, row);
      toast("Clause updated (v" + (cur.version + 1) + ").", "success");
    } else {
      await sb("POST", "/rest/v1/pms_proposal_clauses", row);
      toast("Clause created.", "success");
    }
    state.lib = null; state.libEditKey = null; state.libNew = false; render();
  } catch (e) { toast("Save failed: " + e.message, "error"); }
}
async function libSetStatus(key, status) {
  const cur = libClauseByKey(key);
  if (!cur) return;
  try {
    await sb("PATCH", "/rest/v1/pms_proposal_clauses?id=eq." + cur.id, { status });
    state.lib = null; render();
  } catch (e) { toast("Status change failed: " + e.message, "error"); }
}

// Client rate schedules — stored INSIDE the client jsonb (client.rateSchedule)
// so they ride the PMS's existing versioned save path. Seeds project.hourlyRates.
function libClientMatches() {
  const q = (state.libClientQ || "").trim().toLowerCase();
  if (!q) return [];
  return (state.libClients || [])
    .filter(r => r.client && r.client.name && r.client.name.toLowerCase().includes(q))
    .slice(0, 8);
}
async function libSaveClientRates(rowId) {
  const rows = Array.from(document.querySelectorAll("[data-rate-row]"));
  const schedule = rows.map(el => ({
    role: el.querySelector("[data-role]").value.trim(),
    rate: Number(el.querySelector("[data-rate]").value) || 0,
  })).filter(r => r.role);
  const note = $("lib-rate-note") ? $("lib-rate-note").value.trim() : "";
  try {
    // Re-read for a fresh version, then optimistic-locked PATCH (same contract
    // as the PMS saveClientV2 path) so we never clobber a concurrent edit.
    const fresh = (await sb("GET", "/rest/v1/pms_clients?id=eq." + encodeURIComponent(rowId) + "&select=id,version,client"))[0];
    if (!fresh) throw new Error("client row not found");
    const client = { ...fresh.client, rateSchedule: schedule.length ? schedule : undefined, rateScheduleNote: note || undefined };
    if (!schedule.length) delete client.rateSchedule;
    if (!note) delete client.rateScheduleNote;
    const res = await sb("PATCH", "/rest/v1/pms_clients?id=eq." + encodeURIComponent(rowId) + "&version=eq." + fresh.version,
      { client, version: fresh.version + 1, updated_at: new Date().toISOString() });
    if (!res || !res.length) throw new Error("version conflict — someone else saved this client; reload and retry");
    toast(schedule.length ? "Rate schedule saved (" + schedule.length + " roles)." : "Rate schedule cleared — projects fall back to firm-standard rates.", "success");
    state.libClients = null; state.libClientSel = rowId; render();
  } catch (e) { toast("Save failed: " + e.message, "error"); }
}
function libAddRateRow() {
  const tbody = $("lib-rate-rows");
  if (!tbody) return;
  const tr = document.createElement("tr");
  tr.setAttribute("data-rate-row", "");
  tr.innerHTML = `<td><input data-role placeholder="Role" style="width:100%"></td><td><input data-rate type="number" value="0" style="width:90px;text-align:right"></td><td><button class="btn" onclick="this.closest('tr').remove()">×</button></td>`;
  tbody.appendChild(tr);
}

        <li><b>No setup? Nothing breaks:</b> the PMS 📂 button falls back to copying the local path (paste into Explorer), and the add-in's 📂 lands on a helper page (<code>explorer-bridge/open.html</code>) with the path one click away plus the setup download. The add-in must route through that page because Office task panes can only open http/https links.</li>
        <li><b>Auditability:</b> the setup file and handler are plain readable text in the repo's <code>explorer-bridge/</code> folder — no bundled binaries, nothing obfuscated. The setup file's header includes the two-line uninstall.</li>
        <li><b>Security shape:</b> the handler does exactly one thing — open <code>explorer.exe</code> at a single folder name under the user-chosen root. Path separators are stripped, <code>..</code> is rejected, and a missing folder falls back to opening the root (the "add your OneDrive shortcut" cue). No network calls, nothing executed, nothing leaves the machine.</li>
        <li><b>Troubleshooting:</b> Explorer opens the root instead of the project → that project isn't synced on this machine. Wrong location everywhere → delete <code>explorer-root.txt</code> and the next click asks again. Nothing happens at all → look for the browser's blocked "open SettyPMS?" prompt.</li>
      </ul>
    </div>

    <div class="card doc" id="g-templates">
      <div class="sechead">7 · Document templates — how generated documents stay consistent</div>
      <p><b>The problem this solves.</b> Asking Claude for an add service or a subagreement used to
         produce a document with the wrong fonts, no letterhead and a shuffled layout, differently
         every time. That was never the model paraphrasing. The connector's
         <code>get_template</code> returns a template as <b>plain text</b>, and the letterhead is not
         in that text and never was.</p>
      <p>A Word file is a zip of parts. The add service template is 524&nbsp;KB across 38 parts, and
         <code>word/media/image1.png</code> — the SETTY logo — is 471&nbsp;KB of it on its own. The
         tagline lives in <code>word/header1.xml</code>, the fonts in <code>styles.xml</code> and
         <code>theme1.xml</code>, the numbered clauses in <code>numbering.xml</code>, the office
         addresses in the footers. <b>None of that travels in a text payload.</b> So the model was
         redrawing the document from a skeleton and inventing the look each run. A second cause: the
         To/Date and signature blocks are built on <b>tab stops</b>, which flatten to padding in text
         and only line up in a monospace font.</p>

      <p><b>The fix: never generate the document.</b> Copy the real <code>.docx</code> and substitute
         inside it. Every part nobody touches is copied through byte-for-byte, so the letterhead is
         preserved by construction rather than by effort. Verified on all six: package parts, logo,
         headers, footers, styles, theme and numbering come out byte-identical; only
         <code>word/document.xml</code> changes.</p>

      <p style="margin-top:12px"><b>Where things live.</b></p>
      <table style="margin:6px 0"><thead><tr><th>Thing</th><th>Where</th><th>Notes</th></tr></thead><tbody>
        <tr><td><b>Canonical templates</b></td>
            <td>SharePoint → <code>Templates for MCP Connector/</code></td>
            <td>The firm's real templates. Edit these when wording or letterhead changes. What <code>get_template</code> lists.</td></tr>
        <tr><td><b>Tokenized copies</b></td>
            <td>…<code>/Tokenized/</code> subfolder</td>
            <td><b>Generated — never hand-edit.</b> Same documents with fill-ins replaced by <code>{{TOKENS}}</code>. In a subfolder on purpose: <code>get_template</code> does not recurse, so these cannot pollute its name matching.</td></tr>
        <tr><td><b>The tooling</b></td>
            <td>repo → <code>tools/docx-templates/</code></td>
            <td><code>probe.py</code> (inspect), <code>prep.py</code> (build + verify), <code>render.py</code> (fill), <code>configs/*.json</code> (what to tokenize).</td></tr>
      </tbody></table>

      <p style="margin-top:12px"><b>Coverage today.</b> All six WordprocessingML templates build and
         verify: 85 tokens, every package part preserved, zero untokenized placeholders left.</p>
      <table style="margin:6px 0"><thead><tr><th>Template</th><th>Tokens</th><th>Notes</th></tr></thead><tbody>
        <tr><td>Additional Services Agreement</td><td>17</td><td>Scope, fees and exclusions are repeating lists</td></tr>
        <tr><td>Subconsultant Agreement</td><td>21</td><td>Largest; 5 author call-outs stripped, 13 stale fields refreshed</td></tr>
        <tr><td>Certificate of Substantial Completion</td><td>19</td><td>Generic placeholders reused, so all mappings are position-scoped</td></tr>
        <tr><td>Engineer's Supplemental Instructions</td><td>13</td><td>Description body is a repeating list</td></tr>
        <tr><td>Sub Agreement Modification</td><td>12</td><td>Had a live subconsultant name baked into the boilerplate; now a token</td></tr>
        <tr><td>CAD Release Form</td><td>3</td><td>18 numbered clauses are auto-numbered and never touched</td></tr>
        <tr><td style="color:var(--muted)">Building Report Cards</td><td style="color:var(--muted)">—</td><td><b>Not covered.</b> It is an <code>.xltx</code> spreadsheet, not a Word package. Needs separate handling.</td></tr>
      </tbody></table>

      <p style="margin-top:12px"><b>Changing a template.</b> Edit the canonical file in SharePoint as
         normal, then regenerate and re-upload the tokenized copy:</p>
      <pre style="margin:6px 0"><code>cd tools/docx-templates
python prep.py                 # rebuild + verify every template
python prep.py subagreement    # or just one</code></pre>
      <p>Regenerating <b>re-verifies that every token survived</b>. That check is the important part:
         a hand-edit can silently destroy a token, and a destroyed token means a contract goes out
         with a missing fee. If <code>prep.py</code> reports FAIL, the tokenized copy is not safe to
         use — fix it before re-uploading. Adding a brand-new template needs a config; run
         <code>python probe.py "&lt;file&gt;"</code> first to see its structure.</p>

      <p style="margin-top:12px"><b>Things that bite, all of them found the hard way.</b></p>
      <ul>
        <li><b>Counting replacements is not verification.</b> An early build reported "12 of 12 replaced" while having silently destroyed 6 of them. The tooling now reads the finished file back and asserts each token is physically present. Never trust a success count.</li>
        <li><b>Word splits values across runs.</b> In the add service template 4 of 11 target values — including the date and the first fee — are not literal strings inside the file at all. A plain find-and-replace fails on exactly the highest-stakes fields and quietly succeeds everywhere else.</li>
        <li><b>Author call-outs must go first.</b> The subagreement carried 5 red "press Ctrl-A then F9" instruction boxes, one of which says to delete the others. They also broke text parsing around them, hiding two placeholders that then escaped substitution while the build still looked clean.</li>
        <li><b>Stale mirrored fields.</b> The subagreement mirrors values through 9 Word REF fields that ship with cached results. They are now flagged to refresh when the document opens, so nobody has to press Ctrl-A+F9.</li>
        <li><b>SharePoint rewrites .docx files on upload</b>, adding a few KB of its own metadata. Harmless — content comes back identical — but it means <b>a file-size change in SharePoint is not evidence the document was edited</b>.</li>
        <li><b>.dotx vs .docx.</b> Six of the templates are Word <i>template</i> files. Saved under a <code>.docx</code> name without converting the internal type, Word refuses to open them as corrupt. The tooling converts it.</li>
      </ul>

      <p style="margin-top:12px"><b>Known gaps.</b></p>
      <ul>
        <li><b>Not wired into Claude yet.</b> The renderer runs from the repo today. Exposing it to the connector is a pending piece of work, and it must ship as a <b>new</b> tool rather than a new option on <code>get_template</code> — Claude caches tool definitions when a connector is added, so old sessions would silently keep using the text path.</li>
        <li><b>Long project names overflow the add service header.</b> Its To/Date block is tab stops, so about 30 characters fit; past that the line wraps back to the left margin and pushes the client name down. The real fix is rebuilding that block as a table.</li>
        <li><b>Missing values are left visible</b> as <code>{{LIKE_THIS}}</code> with a warning, rather than blanked, so nobody files a document with a silently empty fee. Deliberate, and changeable.</li>
        <li><b>Honorifics are never guessed.</b> "Ms./Mr." has to be supplied; inferring it from a name is not something the tooling will do.</li>
        <li><b>Duplicate template.</b> <code>SubagreementTemplate-Sara-Samsung-PC-2022-11-23.dotx</code> is byte-identical in content to <code>SubagreementTemplate.dotx</code>. Until it is archived, asking for "the sub agreement" can match either one.</li>
      </ul>
    </div>

      <div class="sechead">How the server is set up</div>
      <ul>
        <li><b>Runtime:</b> Supabase Edge Function <code>pms-mcp</code> (Deno) using the Streamable-HTTP MCP transport. Currently <b>deploy 45</b>, build <code>2026-08-02-issue-date</code>. The deploy number is just Supabase's counter; the <b>build string is the meaningful version</b> — it is set in the source and echoed by <code>/health</code>.</li>
        <li><b>Data path:</b> the function holds the service-role key server-side and reads <code>pms_projects</code>, <code>pms_project_emails</code> and the analytics SQL functions. A 5-minute in-memory cache plus a slim field projection keeps broad questions fast.</li>
        <li><b>Documents &amp; templates:</b> project documents and the live "Templates for MCP Connector" SharePoint folder are read through a separate app-only Microsoft Graph app (client credentials, read-only Sites permission — the one admin-consented piece).</li>

        <li><b>Source of truth — changed since v31:</b> the function source is now <b>committed to the repo</b> at <code>supabase/functions/pms-mcp/</code>. It used to live only on the deployed function, so the old rule here was "pull the live source before editing." <b>That rule is retired for <code>pms-mcp</code>:</b> edit the repo copy and deploy from disk. (It still applies to <code>pms-user-emails</code> and <code>weekly-digest</code>, which have not been reconciled yet.)</li>

    <div class="card doc">
      <div class="sechead">Authentication — two accepted credentials</div>
      <table><thead><tr><th>Mode</th><th>Who uses it</th><th>How</th></tr></thead><tbody>
        <tr><td><b>Microsoft sign-in (OAuth)</b></td><td>Everyone on claude.ai — the proper path</td>
            <td>The server answers unauthenticated calls with 401 + a <code>WWW-Authenticate</code> header pointing at its discovery metadata, which names the Setty Entra tenant as the authorization server. Claude walks that flow and each user signs in with their own Setty Microsoft account. Tokens are verified server-side (signature via tenant JWKS, issuer, audience, tenant).</td></tr>
        <tr><td><b>Shared secret (pilot)</b></td><td>Testing / Claude Code / API scripts</td>
            <td><code>Authorization: Bearer &lt;MCP_SHARED_SECRET&gt;</code> — the secret lives in Supabase function secrets, is never in any repo, and can be rotated with one command. claude.ai's connector UI cannot send custom headers, so this mode is for tooling only.</td></tr>
      </tbody></table>
      <ul style="margin-top:8px">
        <li><b>Entra app for the connector:</b> <code>${ENTRA_APP}</code>, exposing scope <code>api://${ENTRA_APP}/MCP.Access</code>.</li>
        <li><b>Accepted audiences:</b> <code>${ENTRA_APP}</code> or <code>api://${ENTRA_APP}</code>; tokens from any other tenant are rejected.</li>
        <li><b style="color:var(--amber)">Token version is an invariant (found the hard way, 5 Aug 2026):</b> the app manifest must keep
            <code>api.requestedAccessTokenVersion = 2</code>. Entra's default is <code>null</code>, which means <b>v1-format tokens</b>
            whose issuer reads <code>sts.windows.net/…</code>. The server validates the v2 issuer only
            (<code>login.microsoftonline.com/&lt;tenant&gt;/v2.0</code>, <code>index.ts</code> in <code>verifyEntraToken()</code>), so with
            the default in place <b>every sign-in succeeds at Microsoft and every request then fails with 401</b>. The client shows no
            error: it silently retries <code>initialize</code> (observed: a dozen attempts in under half a minute) and claude.ai reports
            <i>"This connector has no tools available."</i> If that setting is ever reset, this is the symptom. After correcting it,
            Disconnect and reconnect the connector: tokens are minted at connect time, so an existing connection keeps its old-format token.</li>
        <li><b>Discovery metadata — fixed in v31 (25 Jul 2026):</b> <code>/.well-known/oauth-protected-resource</code> now advertises
            <code>resource</code> = <code>api://${ENTRA_APP}</code>, which matches the scope Claude requests
            (<code>api://${ENTRA_APP}/MCP.Access</code>). Earlier versions advertised the Supabase function URL as the resource
            instead; Entra rejected that mismatch with <b>9010010</b> — <i>"the resource parameter provided in the request doesn't
            match with the requested scopes."</i> Use the discovery link at the top of this tab to confirm the two agree.</li>
        <li><b style="color:var(--amber)">Authorization-server metadata is the break point (corrected 5 Aug 2026):</b> the discovery
            response names the Setty tenant's Microsoft login endpoint, but Entra publishes only
            <code>openid-configuration</code> there and returns <b>404</b> at all three RFC 8414 locations. Claude therefore finds
            no authorization-server metadata, falls back to deriving <code>&lt;origin&gt;/authorize</code> from the connector URL,
            and Supabase answers <code>{"error":"requested path is invalid"}</code>.
            <b>Earlier guidance on this page said that 404 was expected and not worth chasing. That was wrong.</b> It is the fault,
            and it is why org-wide sign-in never completed.</li>
        <li><b>The fix is a discovery proxy</b> (<code>mcp-proxy/</code> in the repo). Claude derives OAuth discovery from the
            <b>origin</b> of the connector URL and discards the path, so it probes the Supabase gateway root, which is not ours to
            answer. A Supabase custom domain would not help, since it white-labels the same gateway. The proxy owns a root we do
            control, names <i>itself</i> as the authorization server so the issuer matches where the document was fetched from, and
            points the endpoints at Entra. Sign-in still goes directly to Microsoft and no token passes through the proxy.</li>
        <li><b>Two client secrets, deliberately (5 Aug 2026):</b> app <code>${ENTRA_APP}</code> backs two unrelated flows. One
            secret lives in Supabase as <code>GRAPH_CLIENT_SECRET</code> for <b>app-only SharePoint reading</b>; a separate one
            lives in the Claude admin console for <b>connector sign-in</b>. They were a single secret until a rotation nearly took
            document reading down with it. <b style="color:var(--amber)">Never delete "the other" secret while rotating.</b>
            Removing the Graph one breaks <code>find_document</code>, <code>list_project_documents</code> and
            <code>read_document</code> for everyone, and it fails at the next token mint rather than at deletion, so the damage
            surfaces later and looks unrelated.</li>
      </ul>
    </div>

    <div class="card doc">
      <div class="sechead">Connecting it to enterprise Claude (the admin steps)</div>
      <p style="font-size:12.5px;border-left:3px solid var(--blue,#2563eb);padding-left:10px;margin-top:0">
        <b>Read this first — it is where this stalls.</b> Steps 1 and 2 happen in <b>claude.ai</b> and can only be done by an
        <b>Owner or Primary Owner</b> of the Claude organisation. Steps 3 and 4 happen in <b>Entra</b> and need a Microsoft admin.
        They are usually different people, and neither can do the other's part.
        <b>An Admin who is not an Owner will not see the Connectors section at all</b> — the button is absent rather than greyed out,
        which reads as "it's broken" when it is really "wrong role". Check the role before debugging anything else.</p>
      <ol>
        <li><b>Add the connector once, org-wide <span style="color:var(--muted)">(Claude Owner / Primary Owner only)</span>:</b>
            claude.ai → <b>Organization settings → Connectors → Add</b>. Name: <code>Setty PMS</code>.
            URL: the connector URL above (it must end in <code>/mcp</code> — no trailing slash, nothing after it).
            Owners are the only role that can add a custom connector on Team and Enterprise plans; there is no way to delegate
            this with a custom role, because connector permissions only cover connectors an Owner has <i>already</i> added.</li>
        <li><b>Give Claude the OAuth client:</b> Entra ID does <b>not</b> support automatic (dynamic) client registration, so open the connector's <b>Advanced settings</b> and enter OAuth Client ID <code>${ENTRA_APP}</code> plus a client secret. <b>IT should create their own secret</b> in the app registration (Certificates &amp; secrets &rarr; New client secret) and paste it straight in, rather than having one sent to them: the value then never travels through email or chat, and connector sign-in stays independent of the Graph secret described above. Leave every other secret row alone.</li>
        <li><b>Authorize Claude's callback in Entra:</b> app registration <code>${ENTRA_APP}</code> → Authentication. For <b>claude.ai in the browser</b>: redirect URI <code>https://claude.ai/api/mcp/auth_callback</code> under the <b>Web</b> platform. For <b>Claude Desktop / Claude Code</b>: they use a localhost loopback instead — add <code>http://localhost</code> and <code>http://127.0.0.1</code> under "Mobile and desktop applications" and set "Allow public client flows" to Yes. If sign-in fails with <b>AADSTS50011</b> (redirect mismatch), copy the exact URI out of that error into the registration.</li>
        <li><b>Consent (corrected 5 Aug 2026):</b> earlier versions of this page said the tenant blocks all user self-consent and that an
            admin grant was required first. <b>The first real sign-in disproved that:</b> <code>MCP.Access</code> consented user-side with
            no admin involved, and the blank "Granted for Setty and Associates" status on the API permissions page is cosmetic, not a
            blocker. So expect consent to just work. If a user does hit <b>AADSTS65001</b>, an admin can still clear it for everyone with
            <b>Grant admin consent for Setty</b> under the app's API permissions, and note the consent prompt always renders the app's
            <i>entire</i> permission list even when only one scope is new, so it looks bigger than what is being granted.</li>
        <li><b>Users enable it:</b> each person turns the connector on under Settings → Connectors in claude.ai; the first use walks them through the Microsoft sign-in. After that they can just ask — "what's open on SAPX256001?" — and Claude uses the PMS tools.</li>
      </ol>
      <p style="font-size:12.5px;border-left:3px solid var(--ok,#15803d);padding-left:10px">
        <b>Before debating whose fault it is:</b> anyone can prove the server half is healthy in two clicks, signed in to nothing.
        <b>Live health check</b> returns <code>{"ok":true}</code> with a build string, and <b>OAuth discovery metadata</b> must show
        <code>resource</code> = <code>api://${ENTRA_APP}</code> and a scope of <code>api://${ENTRA_APP}/MCP.Access</code>.
        If both look right, the server half is healthy. That is <i>not</i> the same as sign-in working: see the
        authorization-server metadata note above, which is the actual blocker and is fixed by the discovery proxy rather than by
        anything in this list. Note also that a <b>custom connector needs no API key</b>: it is OAuth with a client ID and secret,
        and dynamic client registration is not required.</p>
      <p style="font-size:12.5px;color:var(--muted)"><b>Worth knowing for later:</b> Anthropic has an
        <b>Enterprise-Managed Auth</b> beta that provisions connectors org-wide through the identity provider, so staff get them on
        first login and nobody connects individually. It is waitlist-only today, so it is not the route out of the current setup,
        but it is the shape this eventually takes.</p>
      <p style="font-size:12.5px;border-left:3px solid var(--warn,#b45309);padding-left:10px"><b>⚠ Local Python bridge — deprecated, do not deploy to new devices.</b>
        Before the org-level connector was available, a small Python stdio bridge (<code>dev/setty-pms-mcpb/local-server/server.py</code>,
        plus the <code>setty-pms.mcpb</code> bundle) was installed per-device and wired into <code>claude_desktop_config.json</code>,
        matching the SETTYAI tools pattern. <b>It carries the shared secret in plain text inside the file</b>, so every user of a bridged
        device reaches the server as one generic caller rather than as themselves — no Microsoft sign-in, no per-user identity, nothing
        for the Phase 5 role work to act on. It also has to be touched on every machine to change anything. The OAuth connector above
        supersedes it. Retire existing installs rather than updating them, and rotate <code>MCP_SHARED_SECRET</code> once the last one is gone.</p>
      <p style="font-size:12.5px"><b>Testing outside claude.ai:</b> Claude Code can attach it with
        <code>claude mcp add --transport http setty-pms ${MCP_URL}</code> (add
        <code>--header "Authorization: Bearer &lt;secret&gt;"</code> to use the pilot secret), and the MCP Inspector
        (<code>npx @modelcontextprotocol/inspector</code>) can exercise every tool directly.</p>
    </div>

    <div class="card doc">
      <div class="sechead">Troubleshooting — work down this list</div>
      <table><thead><tr><th>Symptom</th><th>Check / fix</th></tr></thead><tbody>
        <tr><td>Is the server even up?</td><td>Open the <b>Live health check</b> above — {"ok":true} means yes. Anything else: check the function's logs in the Supabase dashboard.</td></tr>
        <tr><td>Connector won't add / OAuth never starts</td><td>Open the <b>OAuth discovery metadata</b> link — it must return JSON naming the Microsoft login server. Confirm the URL you registered ends exactly in <code>/mcp</code>.</td></tr>
        <tr><td>OAuth starts but Claude can't register itself</td><td>That's the Entra no-dynamic-registration limitation — paste the client ID into the connector's Advanced settings (step 2 above).</td></tr>
        <tr><td>Microsoft error <b>AADSTS50011</b> (redirect URI mismatch)</td><td>Add the exact callback URI from the error to app registration <code>${ENTRA_APP}</code>.</td></tr>
        <tr><td><b>Connected, but "This connector has no tools available"</b></td><td><b>This is an auth failure wearing a tools costume</b> (diagnosed on the wire, 5 Aug 2026). The client's <code>initialize</code> is getting 401 from the server and it retries silently instead of surfacing an error, so the UI concludes the server has no tools. Check in order: (1) the app manifest still has <code>requestedAccessTokenVersion = 2</code> (the Authentication card explains); (2) remove the connector and <b>re-add</b> it, because tool inventories are enumerated when a connector is <i>added</i> and editing an entry does not re-enumerate; (3) watch the traffic directly with <code>npx wrangler tail setty-pms-mcp</code> from <code>mcp-proxy/</code>, which logs each request's MCP method and the upstream status, so "who is failing" stops being a debate.</td></tr>
        <tr><td>Microsoft error <b>AADSTS65001 / 90094</b> (needs approval)</td><td>User consent should work on this tenant (proven 5 Aug 2026), so this error is <i>not</i> expected. If it appears anyway, an admin grants <code>MCP.Access</code> tenant-wide: step 4 above.</td></tr>
        <tr><td>Microsoft error <b>9010010</b> (<i>resource parameter doesn't match the requested scopes</i>)</td><td>The server's discovery metadata and the requested scope disagree on the resource identifier. <b>Fixed server-side in v31</b> — open the <b>OAuth discovery metadata</b> link above and confirm <code>resource</code> reads <code>api://${ENTRA_APP}</code> (not the Supabase URL). If it does and sign-in still fails, remove and re-add the connector so Claude re-reads the metadata rather than a cached copy.</td></tr>
        <tr><td>Signed in, but every tool call returns Unauthorized</td><td>The token Claude got isn't for our API — verify the connector requests scope <code>api://${ENTRA_APP}/MCP.Access</code> (audience mismatch is rejected server-side), and that the account is in the Setty tenant.</td></tr>
        <tr><td>First question times out, second works</td><td>Cold start: the function loads the portfolio on first use, then caches for 5 minutes. A keep-warm job pings /health every 2 minutes, but the first call right after a deploy can still be slow — one retry is normal.</td></tr>
        <tr><td>Claude Desktop shows the connector "offline" intermittently</td><td>That's the local bridge, not the server (the server logs show calls completing in 1–2.5s). Preferred fix: retire the bridge and use the OAuth connector. If a bridge must stay up temporarily and its config uses <code>npx -y mcp-remote</code>, pin a known-good version (e.g. <code>mcp-remote@0.1.37</code>) so it stops re-downloading "latest" on every launch.</td></tr>
        <tr><td>A newly added tool doesn't show up</td><td>MCP clients cache the tool list at connect time: disconnect/reconnect the connector (or restart Desktop) after any server update. For claude.ai connector <i>entries</i> the cache is stickier still: enumeration happens when the connector is added, so after server-side changes remove and re-add the entry rather than editing it.</td></tr>
        <tr><td>Everything worked, then stopped for everyone</td><td>Check whether the shared secret was rotated or the function was redeployed mid-conversation; re-try, then check Supabase function logs.</td></tr>
        <tr><td><b>"I'm an admin and there's no Connectors section"</b></td><td>Only an <b>Owner or Primary Owner</b> can add a custom connector. The section is absent for other roles, not greyed out, so it reads as a missing feature. Confirm the role in claude.ai before anything else — this is the single most common stall on this integration.</td></tr>
      </tbody></table>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">Owners: Sara Arias &amp; Danny Kang.
        <b>Server code lives in the repo</b> at <code>supabase/functions/pms-mcp/</code> — edit there and deploy from disk.
        (The old "pull the live function first, disk is stale" rule was retired for <code>pms-mcp</code> when the source was committed;
        it still applies to <code>pms-user-emails</code> and <code>weekly-digest</code>.)</p>
    </div>

    <div class="card doc">
      <div class="sechead">Roadmap — drawing intelligence <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">(tracking, updated 28 Jul 2026)</span></div>
      <p>Goal: ask Claude what is <i>on</i> the drawings, not just which drawings exist. The target question is
         <b>"what is the history of the Perchloric Fume Hood on project XYZ?"</b> — when it first appeared, on which
         sheets, at which revision, and what the design shows. That is three separate capabilities, so it is staged.</p>
      <table><thead><tr><th style="width:80px">Phase</th><th>What it delivers</th><th style="width:150px">Status</th></tr></thead><tbody>
        <tr><td><b>0</b></td>
            <td><b>Verify the drawings carry a text layer.</b> Tested <code>read_document</code> against real Tabler sheets (SAPX196006.00). The drawings are Revit vector exports, so the text layer is complete — and it holds in both eras.
              <ul style="margin:6px 0">
                <li><b>E211, 2025 plan sheet — 12,447 characters.</b> Equipment tags (<code>UH-4</code>, <code>CHWP-2</code>, <code>FCU-11</code>, <code>CH-1</code>), specifications inline (<code>350KW, 208V, 3PH DIESEL GENERATOR</code>), room names and numbers, and all 38 keynotes in full prose.</li>
                <li><b>M801, 2019 CD submission — 9,753 characters.</b> Full controls abbreviation list, general requirements, equipment tags. <b>Age is not a problem.</b></li>
              </ul></td>
            <td><span class="pill ok">PASSED 28 Jul</span></td></tr>
        <tr><td><b>1</b></td>
            <td><b>The transmittal register.</b> Know which sheet went out at which revision, when, and to whom. The transmittal app already parses sheet number, title, revision and discipline from filenames; this persists them to <code>pms_filing_log</code>. The SharePoint "Transmittals Sent" list was dropped, having never worked.</td>
            <td><span class="pill info">PR #74 OPEN</span><br><span style="font-size:11.5px;color:var(--muted)">then blocked on adoption — the register only fills as the app gets used</span></td></tr>
        <tr><td><b>2</b></td>
            <td><b>Drawing text index + <code>search_drawings</code>.</b> Extract text per sheet per revision into a table, indexed <i>lazily on demand and cached</i> rather than by bulk sweep. Then an MCP tool returning sheet, revision and matching snippet. <b>This alone answers "which sheets show the perchloric fume hood," which is most of the value.</b></td>
            <td><span class="pill" style="background:var(--card2);color:var(--muted)">PLANNED</span></td></tr>
        <tr><td><b>3</b></td>
            <td><b>History across revisions.</b> Group the index by sheet and term to derive "first appeared on M-601 Rev 2, issued with Bulletin #3, still present at Rev 4." <b>Easier than expected:</b> phase 0 found that each sheet's revision block is itself in the text layer, so per-sheet history can be read straight off the drawing rather than reconstructed. The transmittal register still adds who received it and in which package, but this is no longer hard-blocked on register depth or on transmittal adoption.</td>
            <td><span class="pill" style="background:var(--card2);color:var(--muted)">PLANNED</span><br><span style="font-size:11.5px;color:var(--muted)">unblocked by phase 0</span></td></tr>
        <tr><td><b>4</b></td>
            <td><b><code>view_drawing</code> — visual read.</b> Render a specific sheet, or a region of one, so Claude can read what the text layer cannot show. Server-side rendering was proven working on 18 Jun 2026 and never built.</td>
            <td><span class="pill" style="background:var(--card2);color:var(--muted)">PLANNED</span><br><span style="font-size:11.5px;color:var(--muted)">raises token usage — see note</span></td></tr>
        <tr><td><b>5</b></td>
            <td><b>Optional: structured schedule extraction.</b> Equipment schedules are tabular; parsing them into rows would make "what are the design parameters" an exact answer rather than prose. Only worth doing if phase 2 shows schedules extract cleanly but read confusingly.</td>
            <td><span class="pill" style="background:var(--card2);color:var(--muted)">MAYBE</span></td></tr>
      </tbody></table>
      <ul style="margin-top:10px">
        <li><b>Findings from phase 0, worth building on.</b> <b>(a)</b> Each sheet's <b>revision block extracts as text</b> — E211 returned <code>A ADDENDUM #A 01/22/2025 / B ADDENDUM #B 02/05/2025 / C BULLETIN #1 04/11/2025</code>, and the 2019 base issue returned the same header with an empty table. So the drawings describe their own revision history. <b>(b)</b> Sheet metadata should be read from the <b>title block, not the filename</b>: the title block reliably yields sheet number, drawing title, date, drawn-by, checked-by, project number and phase, whereas filenames are inconsistent across eras — 2025 files are <code>E211 - GROUND FLOOR PLAN - EAST WING - ELECTRICAL POWER.pdf</code> while 2019 files are a bare <code>M801.pdf</code>.</li>
        <li><b>Phase 4 is the one that changes the cost story.</b> Everything up to it is text, which is cheap. Images consume far more context than text, so when <code>view_drawing</code> ships the answer to "what does this cost" changes from "minimal" to "minimal, plus drawing rendering when someone asks for it." That is a deliberate trade, worth flagging to leadership when it lands rather than after.</li>
        <li><b>Two hard-won constraints for phase 4.</b> Use the <b>deno.land</b> build of imagescript — <code>npm:imagescript</code> crashes the edge worker on an unsupported native codec. And an E-size sheet at full scale is roughly 140MB of bitmap, so resolution must be capped around 1500–2000px; but at that size small text is illegible, so the tool needs a <b>region/crop argument</b> rather than whole-sheet rendering. Phases 1–3 are what make that targetable: the register names the file and the index names the sheet.</li>
        <li><b>Index lazily, never in bulk.</b> The 24 Jun firm-wide outage was write contention from a bulk sweep. The field-photo index already uses the lazy pattern — it fills as people browse — and this should match it.</li>
        <li><b>Keep the MCP read-only.</b> Register writes happen in the transmittal app; the connector only ever reads.</li>
      </ul>

      <div class="sechead">Best practices (IT &amp; whoever maintains this)</div>
      <ul>
        <li><b>Rollout timing:</b> the connector is <b>independent of the security-rollout phases</b> — it never touches the anon key or user database sessions (it has its own gate + a server-side key), so the Phase 4 RLS flip changed nothing for it. Connect it whenever IT is ready; the admin-consent step is usually the long pole, so start that early.</li>
        <li><b>Where the connector sits relative to Phase 5</b> <span style="color:var(--muted)">(re-verified against deployed build 2026-08-02-issue-date, 2 Aug 2026 — still true: all connector reads use the server-side key, so the Phase 5 capability checks do not scope connector results)</span>:
            the Microsoft sign-in is an <b>authentication gate, not an identity</b> — <code>verifyEntraToken()</code> checks the token's
            signature, issuer, audience and tenant and returns <i>true/false</i>, discarding the payload. No user claim (oid, upn,
            preferred_username) reaches any query. Every read then goes out with the <code>SUPABASE_SERVICE_ROLE_KEY</code>, which bypasses
            RLS by design, and the source contains no reference to <code>pms_has_cap</code> or <code>auth.uid</code>. So role capabilities do
            <b>not</b> narrow what the connector returns, and the sign-in proves only "this is a current Setty account."
            That is acceptable because the connector is read-only and surfaces what staff already see in PMS — but note it is
            <b>not</b> one config change away from per-role scoping: the verifier would have to return its claims, and each tool
            would need to filter on them.</li>
        <li><b>Keep it read-only.</b> All writes go through the PMS apps, which handle versioning and conflict protection. Adding write tools to the connector is a deliberate architecture decision, not a tweak.</li>
        <li><b>Finalize before broad rollout:</b> because clients cache the tool list, add/settle new tools first, then have the team connect — otherwise everyone needs a reconnect to see them.</li>
        <li><b>Deploy discipline:</b> pull the live source before editing (disk copies drift stale — deploying one would regress features), keep <code>verify_jwt</code> off with the deno.json import map on every deploy, and hit <code>/health</code> afterward — a 200 proves it compiled and booted.</li>
        <li><b>Rotating the shared secret:</b> set a new <code>MCP_SHARED_SECRET</code> in Supabase function secrets — old callers cut off instantly. The OAuth path is unaffected by rotation, so once the deprecated local bridges are decommissioned this can be rotated freely with nothing else to update. Until then it is also embedded in any remaining bridge install.</li>
        <li><b>New permissions need lead time:</b> any new Entra scope or Graph permission requires an IT admin-consent click (tenant policy) — plan it into the schedule rather than discovering it at rollout.</li>
        <li><b>Watch, don't guess:</b> Supabase dashboard → Edge Functions → pms-mcp → Logs shows every request with timing; the server has been measured healthy at ~1–2s warm, so persistent slowness reports usually point at the client bridge or a cold start, not the server.</li>
        <li><b>Data caveat everyone should know:</b> shared service view — any connected user can ask about <i>any</i> project (same as the PMS itself). If per-user or per-role visibility is ever needed, the Entra sign-in already identifies the user; scoping would build on the Phase 5 roles registry.</li>
      </ul>
    </div>`;
}

// ── Boot ─────────────────────────────────────────────────────────────────────
settyAuth.onChange(() => { state.roster = state.roles = state.backups = state.filing = null;
  state.permCatalog = state.permMatrix = state.permOverrides = null; state.myRole = undefined; render(); });
settyAuth.init().catch(e => toast("Sign-in: " + e.message, "error")).then(render);
</script>
