# Manual deploy of the pms-mcp edge function, mirroring
# supabase/functions/pms-mcp/deploy.ps1: deploy from the repo root with
# --no-verify-jwt (the function does its own auth), then poll /health until it
# reports a new build. The build names the deployed copy ("deploy-412", from the
# runtime's DENO_DEPLOYMENT_ID, see buildLabel.ts), so a new deploy shows as a
# label different from the one live before it.
#
# One-time setup: add a repo secret SUPABASE_ACCESS_TOKEN (a Supabase personal
# access token, supabase.com -> Account -> Access Tokens). Run it from the
# Actions tab: "Deploy pms-mcp" -> Run workflow, with main selected.
name: Deploy pms-mcp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pms-mcp
  cancel-in-progress: false

env:
  PROJECT_REF: khxmgjilwhdguuepbhne

jobs:
  deploy:
    # A deploy is whatever main holds; never ship an unreviewed branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read the build that is live now
        id: before
        run: |
          body=$(curl -s --max-time 30 "https://${PROJECT_REF}.supabase.co/functions/v1/pms-mcp/health" || true)
          before=$(echo "$body" | grep -oP '"build":"\K[^"]+' || true)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "Live before this deploy: ${before:-nothing answered}"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Repo secret SUPABASE_ACCESS_TOKEN is not set" >&2; exit 1; fi
          # Repo root, no --import-map (the CLI finds pms-mcp/deno.json itself).
          # --yes: newer CLIs ask "Deploy 1 Function?" and, with no terminal to
          # answer, exit 1 having changed nothing (runs 27-28, 2026-11-03).
          supabase functions deploy pms-mcp --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      - name: Wait for /health to report a new build
        env:
          BEFORE: ${{ steps.before.outputs.before }}
        run: |
          url="https://${PROJECT_REF}.supabase.co/functions/v1/pms-mcp/health"
          for i in $(seq 1 12); do
            body=$(curl -s --max-time 30 "$url" || true)
            echo "attempt $i: $body"
            now=$(echo "$body" | grep -oP '"build":"\K[^"]+' || true)
            # A deployed copy always says deploy-<n>; "local" here would mean the
            # runtime gave no deployment id, which the label cannot work without.
            if echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"build":"deploy-' && [ "$now" != "$BEFORE" ]; then
              echo "Live: build $now (was ${BEFORE:-nothing})"
              exit 0
            fi
            sleep 5
          done
          echo "Health check never reported a new build (still ${BEFORE:-nothing})" >&2
          exit 1
