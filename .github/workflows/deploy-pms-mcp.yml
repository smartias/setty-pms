# Manual deploy of the pms-mcp edge function, mirroring
# supabase/functions/pms-mcp/deploy.ps1: deploy from the repo root with
# --no-verify-jwt (the function does its own auth), then poll /health until it
# reports the BUILD constant on disk.
#
# One-time setup: add a repo secret SUPABASE_ACCESS_TOKEN (a Supabase personal
# access token, supabase.com -> Account -> Access Tokens). Run it from the
# Actions tab: "Deploy pms-mcp" -> Run workflow, with main selected.
name: Deploy pms-mcp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pms-mcp
  cancel-in-progress: false

env:
  PROJECT_REF: khxmgjilwhdguuepbhne

jobs:
  deploy:
    # A deploy is whatever main holds; never ship an unreviewed branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read BUILD from index.ts
        id: build
        run: |
          build=$(grep -oP '^const BUILD = "\K[^"]+' supabase/functions/pms-mcp/index.ts)
          if [ -z "$build" ]; then echo "Could not read the BUILD constant" >&2; exit 1; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Deploying BUILD $build"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Repo secret SUPABASE_ACCESS_TOKEN is not set" >&2; exit 1; fi
          # Repo root, no --import-map (the CLI finds pms-mcp/deno.json itself).
          supabase functions deploy pms-mcp --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Wait for /health to report the new build
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          url="https://${PROJECT_REF}.supabase.co/functions/v1/pms-mcp/health"
          for i in $(seq 1 12); do
            body=$(curl -s --max-time 30 "$url" || true)
            echo "attempt $i: $body"
            if echo "$body" | grep -q "\"ok\":true" && echo "$body" | grep -q "\"build\":\"$BUILD\""; then
              echo "Live: build $BUILD"
              exit 0
            fi
            sleep 5
          done
          echo "Health check never reported build $BUILD" >&2
          exit 1
