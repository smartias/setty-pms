# Manual deploy of the proposal-draft edge function (in-app proposal drafting
# from RFP text). Its drafting rules live in the function source, so a merge to
# main does not ship them: run this after any change under
# supabase/functions/proposal-draft/.
#
# Uses the same repo secret as "Deploy pms-mcp": SUPABASE_ACCESS_TOKEN. Run it
# from the Actions tab: "Deploy proposal-draft" -> Run workflow, with main selected.
#
# Unlike pms-mcp this function keeps Supabase's JWT gate (no --no-verify-jwt):
# only signed-in suite users reach it. It has no /health route, so the last step
# only confirms the function answers and still refuses an unauthenticated call.
name: Deploy proposal-draft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-proposal-draft
  cancel-in-progress: false

env:
  PROJECT_REF: khxmgjilwhdguuepbhne

jobs:
  deploy:
    # A deploy is whatever main holds; never ship an unreviewed branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Repo secret SUPABASE_ACCESS_TOKEN is not set" >&2; exit 1; fi
          # Repo root. --yes: newer CLIs ask to confirm and, with no terminal to
          # answer, exit 1 having changed nothing.
          supabase functions deploy proposal-draft --project-ref "$PROJECT_REF" --yes

      - name: Confirm the function answers and the JWT gate is on
        run: |
          url="https://${PROJECT_REF}.supabase.co/functions/v1/proposal-draft"
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$url" -H 'content-type: application/json' -d '{"action":"status"}' || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "401" ]; then echo "Up, and unauthenticated calls are refused"; exit 0; fi
            sleep 5
          done
          echo "Expected 401 from an unauthenticated call, got $code" >&2
          exit 1
