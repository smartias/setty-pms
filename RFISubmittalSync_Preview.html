<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RFI / Submittal Tracker — Setty</title>
<meta name="color-scheme" content="dark light" />
<script>/* Apply the saved theme before first paint so a light-theme user never sees a dark flash. */try{if(localStorage.getItem("rfiTrackTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
<style>
  /* Theme tokens. Dark is the default (the suite's look); <html data-theme="light">
     swaps every token below. Anything coloured must use a token, never a hex. */
  :root { color-scheme:dark;
          --bg:#0f172a; --bg2:#0b1220; --bg3:#0a1426; --card:#1e293b; --card2:#172033; --line:#334155; --hover:#1a2233;
          --txt:#e2e8f0; --txt2:#cbd5e1; --strong:#fff; --muted:#94a3b8;
          --accent:#38bdf8; --primary-bg:#38bdf8; --on-primary:#04240f; --go-bg:#10b981; --on-go:#04240f; --btn-bg:#334155; --btn-txt:#e2e8f0;
          --ok:#10b981; --ok-line:#14532d; --new:#f59e0b; --new-badge:#f59e0b; --matched:#475569; --matched-txt:#cbd5e1; --update:#0ea5e9;
          --danger:#ef4444; --danger-line:#7f1d1d; --danger-txt:#fca5a5; --late:#f87171; --warn:#fbbf24;
          --inbox-bg:#1a2436; --plat-bg:#1e3a5f; --plat-txt:#93c5fd;
          --overlay:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.5); --justnew:rgba(16,185,129,.07);
          --due-late-bg:rgba(248,113,113,.13); --due-late-line:rgba(248,113,113,.35); --due-soon-bg:rgba(245,158,11,.13); --due-soon-line:rgba(245,158,11,.35);
          --due-ok:#34d399; --due-ok-bg:rgba(16,185,129,.12); --due-ok-line:rgba(16,185,129,.3); --late-row:rgba(248,113,113,.06); --unrev-bg:rgba(245,158,11,.15); --intake-bg:rgba(245,158,11,.10);
          --sev-life-safety:#f87171; --sev-agency:#fbbf24; --sev-cost:#fb923c; --sev-rfi-bait:#60a5fa; --sev-polish:#94a3b8; }
  :root[data-theme="light"] { color-scheme:light;
          --bg:#f1f5f9; --bg2:#ffffff; --bg3:#f8fafc; --card:#ffffff; --card2:#f8fafc; --line:#cbd5e1; --hover:#eef2f7;
          --txt:#0f172a; --txt2:#1e293b; --strong:#0f172a; --muted:#475569;
          --accent:#0369a1; --primary-bg:#0284c7; --on-primary:#ffffff; --go-bg:#059669; --on-go:#ffffff; --btn-bg:#e2e8f0; --btn-txt:#0f172a;
          --ok:#047857; --ok-line:#86efac; --new:#b45309; --new-badge:#f59e0b; --matched:#e2e8f0; --matched-txt:#334155; --update:#0ea5e9;
          --danger:#b91c1c; --danger-line:#fca5a5; --danger-txt:#b91c1c; --late:#b91c1c; --warn:#b45309;
          --inbox-bg:#fffbeb; --plat-bg:#dbeafe; --plat-txt:#1d4ed8;
          --overlay:rgba(15,23,42,.45); --shadow:rgba(15,23,42,.18); --justnew:rgba(5,150,105,.10);
          --due-late-bg:#fee2e2; --due-late-line:#fca5a5; --due-soon-bg:#fef3c7; --due-soon-line:#fcd34d;
          --due-ok:#047857; --due-ok-bg:#d1fae5; --due-ok-line:#6ee7b7; --late-row:rgba(185,28,28,.05); --unrev-bg:#fef3c7; --intake-bg:#fffbeb;
          --sev-life-safety:#b91c1c; --sev-agency:#b45309; --sev-cost:#c2410c; --sev-rfi-bait:#1d4ed8; --sev-polish:#64748b; }
  /* Status pills — one class per status so both themes can restyle them. */
  .pill { background:var(--matched); color:var(--muted); }
  .pill.st-open, .pill.st-received { background:#1e3a5f; color:#60a5fa; }
  .pill.st-pending-sub-response, .pill.st-pending-sub-review { background:#3b2a1a; color:#f59e0b; }
  .pill.st-responded, .pill.st-returned { background:#1a3a2a; color:#34d399; }
  .pill.st-closed { background:#1a1a2e; color:#94a3b8; } .pill.st-void { background:#1a1a1a; color:#9ca3af; }
  .pill.st-under-review { background:#2a1a3b; color:#a78bfa; } .pill.st-resubmittal-required { background:#3b1a1a; color:#f87171; }
  :root[data-theme="light"] .pill.st-open, :root[data-theme="light"] .pill.st-received { background:#dbeafe; color:#1d4ed8; }
  :root[data-theme="light"] .pill.st-pending-sub-response, :root[data-theme="light"] .pill.st-pending-sub-review { background:#fef3c7; color:#b45309; }
  :root[data-theme="light"] .pill.st-responded, :root[data-theme="light"] .pill.st-returned { background:#d1fae5; color:#047857; }
  :root[data-theme="light"] .pill.st-closed { background:#e2e8f0; color:#475569; } :root[data-theme="light"] .pill.st-void { background:#f1f5f9; color:#64748b; }
  :root[data-theme="light"] .pill.st-under-review { background:#ede9fe; color:#6d28d9; } :root[data-theme="light"] .pill.st-resubmittal-required { background:#fee2e2; color:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--txt); }
  a { color:var(--accent); }
  header { padding:16px 24px 12px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; }
  .pickbar { padding:12px 24px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--bg2); }
  .pickbar select, .pickbar input { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:13px; }
  /* Project picker: one searchable box. Type a number, name, GC or platform;
     pick with the mouse or arrow keys + Enter. */
  .combo { position:relative; flex:1 1 320px; max-width:600px; }
  .combo input { width:100%; padding-right:34px; }
  .combo .combo-toggle { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); padding:4px 8px; font-size:12px; cursor:pointer; }
  #projList { position:absolute; top:calc(100% + 4px); left:0; right:0; max-height:340px; overflow:auto; margin:0; padding:4px; list-style:none; background:var(--bg2); border:1px solid var(--line); border-radius:10px; z-index:40; box-shadow:0 10px 30px var(--shadow); }
  #projList li { padding:7px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
  #projList li.hi { background:var(--hover); }
  #projList li[aria-selected="true"] { color:var(--accent); font-weight:600; }
  .pickbar .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .picknote { color:var(--muted); font-size:12px; }
  .filterbar { padding:9px 24px; border-bottom:1px solid var(--line); display:none; gap:9px; align-items:center; flex-wrap:wrap; background:var(--bg3); }
  .filterbar select, .filterbar input { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:6px 9px; font-size:13px; }
  .filterbar .spacer { flex:1; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted); align-items:center; }
  #out { padding:8px 24px 90px; }
  .sec { margin-top:18px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .sec > .head { display:flex; align-items:center; gap:10px; padding:11px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .sec > .head h2 { font-size:15px; margin:0; } .sec > .head .count { color:var(--muted); font-weight:400; font-size:13px; }
  .sec > .head .spacer { flex:1; }
  .inbox { background:var(--inbox-bg); border-bottom:1px solid var(--line); }
  .inbox .ihead { padding:9px 16px; font-size:13px; color:var(--warn); font-weight:600; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .inbox .ihead .legend { margin:0 0 0 auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  tbody tr.click { cursor:pointer; } tbody tr.click:hover { background:var(--hover); }
  td.title { max-width:340px; }
  .num { font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; color:var(--accent); white-space:nowrap; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }
  .badge.new { background:var(--new-badge); color:#1c1917; } .badge.matched { background:var(--matched); color:var(--matched-txt); }
  .badge.update { background:var(--update); color:#082f49; }
  .badge.old { background:var(--unrev-bg); color:var(--warn); }
  .pill { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600; }
  .badge.unrev { background:var(--unrev-bg); color:var(--warn); }
  /* Due-date chip — same thresholds as the main PMS SlaChip (overdue / today / ≤2 days / later). */
  .due { display:inline-block; padding:1px 7px; border-radius:10px; font-size:10.5px; font-weight:700; white-space:nowrap; margin-left:6px; }
  .due.late { background:var(--due-late-bg); color:var(--late); border:1px solid var(--due-late-line); }
  .due.soon { background:var(--due-soon-bg); color:var(--warn); border:1px solid var(--due-soon-line); }
  .due.ok { background:var(--due-ok-bg); color:var(--due-ok); border:1px solid var(--due-ok-line); }
  tbody tr.late td { background:var(--late-row); }
  td.date { white-space:nowrap; }
  .sec > .head .count .late { color:var(--late); font-weight:700; } .sec > .head .count .unrev { color:var(--warn); font-weight:700; }
  .muted { color:var(--muted); } .right { text-align:right; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  td.num .rowbtn { background:none; border:none; padding:0; margin:0; font:inherit; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .empty { padding:16px; color:var(--muted); font-size:13px; }
  .err { color:var(--danger-txt); padding:12px 16px; }
  .actions { padding:12px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); padding:7px 13px; background:var(--btn-bg); color:var(--btn-txt); font-weight:600; }
  button.primary { background:var(--primary-bg); color:var(--on-primary); border:none; } button.go { background:var(--go-bg); color:var(--on-go); border:none; }
  button.danger { background:transparent; color:var(--danger); border-color:var(--danger-line); }
  button.ghost { background:transparent; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=checkbox]{ width:16px; height:16px; cursor:pointer; }
  .overlay { position:fixed; inset:0; background:var(--overlay); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50; }
  .overlay.show { display:flex; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:12px; width:680px; max-width:100%; box-shadow:0 20px 60px var(--shadow); }
  .modal .mhead { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  .modal .mhead h3 { margin:0; font-size:16px; } .modal .mhead .x { margin-left:auto; cursor:pointer; color:var(--muted); font-size:20px; background:none; border:0; padding:0; line-height:1; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px 18px; }
  .fld { display:flex; flex-direction:column; gap:4px; } .fld.full { grid-column:1 / -1; }
  /* Only the field heading is uppercased — nested labels (the Assigned-to names) keep their case. */
  .fld > label { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; }
  .fld input[aria-invalid="true"], .fld textarea[aria-invalid="true"], .fld select[aria-invalid="true"], .discSel[aria-invalid="true"] { border-color:var(--danger); box-shadow:0 0 0 1px var(--danger); }
  .formerr { color:var(--danger-txt); font-size:12px; font-weight:600; }
  .filterbar button.chip { font-size:12px; padding:5px 10px; background:transparent; }
  .filterbar button.chip[aria-pressed="true"] { background:var(--plat-bg); color:var(--plat-txt); border-color:var(--plat-txt); }
  th.sortable { padding:0; } th.sortable button { all:unset; box-sizing:border-box; display:block; width:100%; padding:7px 12px; cursor:pointer; font:inherit; color:inherit; white-space:nowrap; }
  th.sortable button:hover, th.sortable button:focus-visible { color:var(--txt); text-decoration:underline; text-underline-offset:3px; }
  th.sortable[aria-sort] button { color:var(--txt); }
  tr.grp td { background:var(--card); padding:9px 12px; border-bottom:1px solid var(--line); }
  tr.grp .rowbtn { font-family:inherit; font-size:13px; }
  .lhead { padding:10px 16px 2px; font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .fld input, .fld select, .fld textarea { background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  .fld textarea { min-height:60px; resize:vertical; }
  /* Sticky inside the scrolling overlay so Save / Cancel stay in reach on a tall form. */
  .mfoot { padding:14px 18px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; position:sticky; bottom:0; background:var(--card); border-radius:0 0 12px 12px; z-index:2; }
  .mfoot .danger { margin-right:10px; }
  .menu { position:relative; display:inline-block; }
  .menu > button[aria-haspopup] { background:transparent; font-size:12px; }
  .menu .items { position:absolute; bottom:calc(100% + 6px); left:0; min-width:300px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:6px; display:none; z-index:5; box-shadow:0 10px 30px var(--shadow); }
  .menu.open .items { display:block; }
  .menu .items a, .menu .items button { display:block; width:100%; text-align:left; background:none; border:0; border-radius:6px; padding:7px 10px; color:var(--txt); font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
  .menu .items a:hover, .menu .items button:hover, .menu .items a:focus-visible, .menu .items button:focus-visible { background:var(--hover); outline:none; }
  .menu .items .hint { display:block; font-size:11px; color:var(--muted); font-weight:400; margin-top:1px; white-space:normal; }
  .intake { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--intake-bg); border:1px solid var(--new); border-radius:8px; padding:8px 12px; margin:12px 18px 0; font-size:12.5px; }
  .mfoot .spacer { flex:1; } .mfoot .by { font-size:11px; color:var(--muted); }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; display:none; z-index:60; }
  .toast.show { display:flex; align-items:center; gap:12px; max-width:min(720px, calc(100vw - 32px)); }
  .toast button { font-size:12px; padding:4px 9px; white-space:nowrap; } .toast.ok { color:var(--ok); border-color:var(--ok-line); } .toast.bad { color:var(--danger-txt); border-color:var(--danger-line); }
  .undobar { position:fixed; bottom:64px; left:50%; transform:translateX(-50%); background:var(--bg2); border:1px solid var(--ok-line); border-radius:10px; padding:8px 14px; font-size:13px; display:none; align-items:center; gap:10px; z-index:60; }
  .undobar.show { display:flex; }
  .inbox select.discSel { background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-size:12px; }
  tbody tr.justnew td { background:var(--justnew); }
  .portal { margin:14px 24px 0; border:1px solid var(--line); background:var(--card2); border-radius:10px; padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .portal .plat { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700; background:var(--plat-bg); color:var(--plat-txt); }
  .portal .plat.guess { background:transparent; border:1px dashed var(--plat-txt); color:var(--plat-txt); }
  .portal input, .portal select { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  .ptag { font-size:11px; color:var(--plat-txt); }
  .rptopts { display:flex; flex-direction:column; gap:12px; padding:16px 18px; }
  .rptopts .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .rptopts select { background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; min-width:240px; }
</style>
</head>
<body>
<header>
  <h1>RFI / Submittal Tracker</h1>
  <div class="sub">The project-wide log for Construction-Administration RFIs &amp; submittals. Saves to the same place as the main PMS.</div>
</header>

<main>
<div class="pickbar">
  <label class="muted" for="projInput">Project</label>
  <div class="combo">
    <input id="projInput" type="text" role="combobox" aria-expanded="false" aria-controls="projList" aria-autocomplete="list" autocomplete="off"
      placeholder="Type a project number, name, GC or platform…" onfocus="comboFocus(event)" oninput="comboInput(event)" onkeydown="comboKey(event)" onblur="comboBlur()" />
    <button type="button" class="combo-toggle" aria-label="Show the project list" tabindex="-1" onmousedown="event.preventDefault()" onclick="comboToggle()">▾</button>
    <ul id="projList" role="listbox" aria-label="Projects" hidden></ul>
  </div>
  <span id="picknote" class="picknote"></span>
  <span class="right">
    <button type="button" class="ghost" id="themeBtn" style="font-size:12px" onclick="toggleTheme()">☀ Light theme</button>
    <button type="button" class="ghost" style="font-size:12px" onclick="openReport()" title="Open RFIs &amp; submittals across all CA projects, filtered by PM — printable (save as PDF) or CSV for Excel">📊 Open-items report</button>
  </span>
</div>

<div class="filterbar" id="filterbar">
  <span class="muted">Show</span>
  <select id="fType" aria-label="Filter by type" onchange="setF('type',this.value)"><option value="all">RFIs + Submittals</option><option value="rfi">RFIs only</option><option value="submittal">Submittals only</option></select>
  <select id="fDisc" aria-label="Filter by discipline" onchange="setF('disc',this.value)"></select>
  <select id="fStatus" aria-label="Filter by status" onchange="setF('status',this.value)"></select>
  <input id="fText" aria-label="Search by number, title, spec, or sender" placeholder="search # · title · spec · from…" oninput="setF('text',this.value)" style="width:220px" />
  <button type="button" class="chip" id="fMine" aria-pressed="false" onclick="toggleMine()" title="Only items assigned to you (matched by your sign-in)">👤 Mine</button>
  <button type="button" class="chip" id="fUnrev" aria-pressed="false" onclick="toggleUnrev()" title="Only auto-imported items nobody has confirmed yet">📥 Unreviewed</button>
  <button class="ghost" onclick="clearFilters()" title="Back to the default view: all types, all disciplines, open items">Reset</button>
  <span id="filterCount" role="status" class="muted" style="font-size:13px"></span>
</div>

<div id="portal" class="portal" style="display:none" aria-live="polite"></div>
<div id="out"><p class="empty">Loading projects…</p></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="if(event.target===this)closeEditor()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="undobar" id="undobar"></div>

<!-- Sheet-reference matcher (same module the main PMS uses; hung on window
     because this app's inline script is not a module). Failure degrades to
     "check unavailable" — never blocks the editor. -->
<script type="module">
  import * as SheetRefs from "./sheetRefs.js";
  window.SheetRefs = SheetRefs;
  import * as CaIntake from "./caIntake.js";
  window.CaIntake = CaIntake;
  window.dispatchEvent(new Event("caintake-ready"));
</script>
<script src="setty-auth.js"></script>
<script>
/* ---- Supabase config (same anon path SettyPMS.html uses, ~line 695) ---- */
const SUPABASE_URL = "https://khxmgjilwhdguuepbhne.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoeG1namlsd2hkZ3V1ZXBiaG5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjg2MDYsImV4cCI6MjA4ODY0NDYwNn0.vtHt2eydU2iQ426iYOzLrqpH2WLXdRnicq-3sNfoNq8";
const H = { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY };
// Suite sign-in (setty-auth.js): H is mutated in place so every fetch — direct
// or {...H} spread at call time — carries the signed-in JWT, falling back to
// anon while signed out (pre-Phase-4 behavior unchanged). Required for the
// Phase 4 RLS flip, when anon loses data access.
const settyAuthReady = (window.settyAuth ? settyAuth.init() : Promise.resolve(null)).catch(() => null)
  .then(() => { if (window.settyAuth) H.Authorization = "Bearer " + settyAuth.token(); });
if (window.settyAuth) {
  settyAuth.onChange(() => { H.Authorization = "Bearer " + settyAuth.token(); placePill(); });
  settyAuth.mountPill();
}
// "You" comes from the sign-in when there is one (read-only then); the free-text
// box stays as the fallback while signed out, so the log always names someone.
// The suite's floating sign-in pill sits bottom-right by default, over the
// table and the toast — park it in the project bar instead.
function placePill(){
  const pill=document.getElementById("settyAuthPill"), host=document.querySelector(".pickbar .right");
  if(!pill||!host||pill.parentElement===host) return;
  Object.assign(pill.style,{position:"static",boxShadow:"none",padding:"7px 12px",fontSize:"12px",lineHeight:"1.2"});
  host.prepend(pill);
}

/* ---- utils ---- */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
function addWD(dateStr, days){ const d=new Date((dateStr||today())+"T00:00:00"); let c=0; while(c<days){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6)c++; } return d.toISOString().slice(0,10); }
// Who is making the change: the sign-in name (the suite's shared session).
// Signed out, there is no name, and a save is logged as "(unknown)".
function getWho(){
  try{ if(window.settyAuth&&settyAuth.isSignedIn&&settyAuth.isSignedIn()) return String((settyAuth.displayName&&settyAuth.displayName())||(settyAuth.email&&settyAuth.email())||"").trim(); }catch(e){}
  return "";
}
let _toastTimer=null;
function toast(msg, ok, action){
  const t=document.getElementById("toast"); clearTimeout(_toastTimer);
  t.setAttribute("role", ok?"status":"alert"); t.className="toast show "+(ok?"ok":"bad");
  t.innerHTML=`<span>${esc(ok?msg:"Error: "+msg)}</span>`+
    (action?`<button type="button" class="primary" onclick="hideToast();(${action.fn})()">${esc(action.label)}</button>`:"")+
    (ok?"":`<button type="button" class="ghost" aria-label="Dismiss" onclick="hideToast()">✕</button>`);
  // Success fades on its own; an error stays until dismissed so a long
  // message (the save-conflict one, for instance) can actually be read.
  if(ok) _toastTimer=setTimeout(hideToast, 3500);
}
function hideToast(){ const t=document.getElementById("toast"); t.className="toast"; t.innerHTML=""; }
// Every failed write lands here: a save conflict gets a one-click reload of the project.
function toastErr(err){ const msg=(err&&err.message)||String(err); toast(msg, false, err&&err.conflict?{label:"Reload project",fn:"function(){selectProject(CURRENT.proj.id)}"}:null); }
// Light / dark: default dark; the choice is per browser (localStorage) and applied in <head> before paint.
function applyTheme(t){ if(t==="light") document.documentElement.setAttribute("data-theme","light"); else document.documentElement.removeAttribute("data-theme");
  const b=document.getElementById("themeBtn"); if(b){ b.textContent=t==="light"?"🌙 Dark theme":"☀ Light theme"; b.title=t==="light"?"Switch back to the dark theme":"Switch to a light theme — easier to read next to printed drawings"; } }
function toggleTheme(){ const t=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light"; try{ localStorage.setItem("rfiTrackTheme",t); }catch(e){} applyTheme(t); }

// PostgREST returns at most 1000 rows per request; page past it.
async function fetchAll(path){ const out=[]; for(let off=0;;off+=1000){ const page=await fetchJson(path+(path.includes("?")?"&":"?")+"limit=1000&offset="+off); out.push(...page); if(page.length<1000) return out; } }
async function fetchJson(path){ const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{headers:H}); if(!r.ok)throw new Error(path+" -> HTTP "+r.status+" "+(await r.text()).slice(0,120)); return r.json(); }

/* ---- Sheet-reference chips (mirror of SettyPMS SheetRefChips: same matcher
   module, same authenticated RPC lookups, same confirm/dismiss semantics;
   decisions ride the record's sheetRefs[] on save). ---- */
const SR_TIER_LABEL={register:"In the transmittal register — this sheet was issued on this project.","drawing-index":"Matches a sheet number parsed from this project's indexed drawings.","drawing-text":"The number appears in this project's indexed drawing text.",unvalidated:"Looks like a sheet number but matches no known sheet — verify before trusting."};
const SR_TIER_ICON={register:"✓","drawing-index":"◆","drawing-text":"◇",unvalidated:"?"};
const _srKeysCache=new Map();
async function srRpc(fn, body){ const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify(body)}); if(!r.ok)throw new Error(fn+" HTTP "+r.status); return r.json(); }
async function srKeys(projId, projNum){
  if(!projId||!window.SheetRefs) return null;
  const hit=_srKeysCache.get(projId); if(hit&&Date.now()-hit.at<600000) return hit;
  const prefix=String(projNum||"").toLowerCase().trim();
  const [logRows, idxKeys]=await Promise.all([
    fetchJson("pms_filing_log?select=files&project_id=eq."+encodeURIComponent(projId)+"&operation=eq.transmittal-generated&limit=1000").catch(()=>[]),
    prefix?srRpc("pms_drawing_sheet_keys",{p_prefix:prefix}).catch(()=>[]):Promise.resolve([]),
  ]);
  const entry={at:Date.now(),registerKeys:window.SheetRefs.registerKeysFromRows(logRows),indexKeys:window.SheetRefs.normalizeKeys(idxKeys),textCache:new Map(),prefix};
  _srKeysCache.set(projId,entry); return entry;
}
async function srTextKeys(entry, terms){
  const out=new Set(); const unknown=[];
  for(const t of terms){ if(entry.textCache.has(t)){ if(entry.textCache.get(t)) out.add(t); } else unknown.push(t); }
  if(unknown.length&&entry.prefix){
    try{ const found=new Set(await srRpc("pms_drawing_text_occurs",{p_prefix:entry.prefix,p_terms:unknown}));
      for(const t of unknown){ entry.textCache.set(t,found.has(t)); if(found.has(t)) out.add(t); } }catch(e){ /* degrades toward 'unvalidated' */ }
  }
  return out;
}
let SR_SUGG=[];
function srItemSnapshot(){ const g=k=>{const e=document.getElementById("f_"+k);return e?e.value:"";}; return {number:g("number"),title:g("title"),description:g("description"),response:g("response"),comments:g("comments"),notes:g("notes")}; }
async function renderSheetRefChips(){
  const box=document.getElementById("sheetRefChips"); if(!box||!EDIT) return;
  try{
    const S=window.SheetRefs; const entry=await srKeys(EDIT.projId, EDIT.projNum);
    if(!S||!entry){ box.innerHTML=`<span class="muted" style="font-size:12px">Sheet-reference check unavailable.</span>`; return; }
    const item=srItemSnapshot();
    const unknown=S.unknownCandidates(item, EDIT.kind, entry.registerKeys, entry.indexKeys);
    const textKeys=await srTextKeys(entry, unknown);
    SR_SUGG=S.computeSuggestions(item, EDIT.kind, {registerKeys:entry.registerKeys, indexKeys:entry.indexKeys, textKeys});
  }catch(e){ SR_SUGG=[]; }
  srPaint();
}
function srPaint(){
  const box=document.getElementById("sheetRefChips"); if(!box||!EDIT) return;
  const stored=EDIT.sheetRefsWork||[]; const decided=new Set(stored.map(x=>x.sheet));
  const confirmed=stored.filter(x=>x.status==="confirmed"); const dismissed=stored.length-confirmed.length;
  const sugg=SR_SUGG.filter(s=>!decided.has(s.sheet));
  const rescan=`<a href="#" onclick="renderSheetRefChips();return false" title="Re-scan this item's text after editing">↻ rescan</a>`;
  const restore=dismissed?` ${dismissed} dismissed — <a href="#" onclick="srRestore();return false">restore</a>.`:"";
  if(!confirmed.length&&!sugg.length){ box.innerHTML=`<span class="muted" style="font-size:12px">No sheet numbers detected in this item's text. ${rescan}${restore}</span>`; return; }
  const chip="display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;";
  let h='<div style="display:flex;flex-wrap:wrap;gap:6px">';
  for(const c of confirmed) h+=`<span title="${esc(SR_TIER_LABEL[c.confidence]||"")}${c.by?"&#10;Confirmed by "+esc(c.by):""}" style="${chip}background:var(--card);border:1px solid var(--accent);color:var(--accent);font-weight:700">📐 ${esc(c.sheet)} <a href="#" onclick="srUndecide('${esc(c.sheet)}');return false" title="Remove this link (returns to suggested)" style="color:var(--txt);text-decoration:none;font-weight:400">✕</a></span>`;
  for(const s of sugg) h+=`<span title="${esc(SR_TIER_LABEL[s.confidence]||"")}${s.snippet?"&#10;"+esc(s.snippet):""}&#10;Found in: ${esc(s.field||"")}" style="${chip}background:var(--card2);border:1px dashed ${s.confidence==="unvalidated"?"var(--line)":"var(--accent)"}">${SR_TIER_ICON[s.confidence]||"?"} ${esc(s.sheet)} <a href="#" onclick="srDecide('${esc(s.sheet)}','confirmed');return false" title="Confirm — this item really is about this sheet" style="color:var(--ok);font-weight:700;text-decoration:none">✓</a> <a href="#" onclick="srDecide('${esc(s.sheet)}','dismissed');return false" title="Dismiss — not a drawing reference" style="color:var(--txt);text-decoration:none">✕</a></span>`;
  h+=`</div><div class="muted" style="font-size:11px;margin-top:6px">Dashed = suggested from this item's text (✓ confirms, ✕ dismisses; decisions save with the record). ✓ register · ◆ drawing index · ◇ drawing text · ? unvalidated. ${rescan}${restore}</div>`;
  box.innerHTML=h;
}
/* "Review ready" watcher: while the editor is open, a light poll (20s) notices
   a fresh Claude review saved by another session and shows a reload bar —
   reload happens IN APP (re-fetch project, reopen the same item). */
function startReviewPoll(){
  if(!EDIT||EDIT.isNew) return;
  const {kind,id,projId}=EDIT; const arrKey=kind==="rfi"?"rfis":"submittals";
  EDIT.reviewPoll=setInterval(async()=>{
    try{
      if(!EDIT||EDIT.id!==id) return;
      const rows=await fetchJson(`pms_projects?id=eq.${projId}&select=items:project->${arrKey}`);
      const hit=((rows[0]&&rows[0].items)||[]).find(x=>x.id===id);
      const at=hit&&hit.aiReview&&hit.aiReview.at;
      if(at&&(!EDIT.ai||at!==EDIT.ai.at)){
        const b=document.getElementById("aiReadyBar"); if(b) b.style.display="flex";
        clearInterval(EDIT.reviewPoll);
      }
    }catch(e){ /* best-effort */ }
  },20000);
}
async function reloadEditorItem(){ if(!EDIT)return; if(!confirm("Reload to view the new Claude review?\n\nAny unsaved edits in this form will be DISCARDED. Cancel to save your edits first."))return; const {kind,id}=EDIT; closeEditor(); await selectProject(CURRENT.proj.id); openEditor(kind,id); }
function srDecide(sheet,status){ if(!EDIT)return; const s=SR_SUGG.find(x=>x.sheet===sheet); if(!s)return; EDIT.sheetRefsWork=[...(EDIT.sheetRefsWork||[]),{sheet:s.sheet,discipline:s.discipline,confidence:s.confidence,field:s.field,snippet:s.snippet,status,by:getWho()||null,at:new Date().toISOString()}]; srPaint(); }
function srUndecide(sheet){ if(!EDIT)return; EDIT.sheetRefsWork=(EDIT.sheetRefsWork||[]).filter(x=>x.sheet!==sheet); srPaint(); }
function srRestore(){ if(!EDIT)return; EDIT.sheetRefsWork=(EDIT.sheetRefsWork||[]).filter(x=>x.status==="confirmed"); srPaint(); }

/* =========================== CA PLATFORM (per project) ===========================
   Which portal a job's RFIs/submittals run through, saved on the project as
   project.caPortal = {platform, gc, by, at}. The sign-in link lives in the
   project's External links (type = platform, caPortal:true), so the main PMS
   lists it and installs it as a folder shortcut. Until someone saves it, the
   platform is a GUESS from the filed notification emails (caIntake.detectPlatforms). */
const PLATFORM_LINK_HINT = { "Procore":"https://app.procore.com/…/project/home", "Autodesk Build":"https://acc.autodesk.com/…", "Newforma":"https://…newforma… (Info Exchange)", "PMWeb":"https://…pmweb…", "Kahua":"https://…kahua.com/…" };
function portalLinkOf(links, platform){ const l=(links||[]).filter(x=>x&&x.url); return l.find(x=>x.caPortal)||l.find(x=>x.type===platform)||null; }
function projEntry(row, det){
  const cp=row.caPortal&&typeof row.caPortal==="object"?row.caPortal:{};
  const link=portalLinkOf(row.links, cp.platform||(det&&det.platform));
  return { id:row.id, name:row.name||"(unnamed)", number:row.number||"", activity:!!det,
    platform:cp.platform||"", gc:cp.gc||"", setBy:cp.by||"", setAt:cp.at||"",
    detected:det?det.platform:"", detectedCounts:det?det.counts:{}, url:link?link.url:"", links:row.links||[] };
}
function platLabel(p){ return p.platform ? p.platform : (p.detected ? p.detected+"?" : ""); }
function platTagHtml(p){ const l=platLabel(p); return l?` <span class="ptag" title="${p.platform?"CA platform (confirmed)":"Guessed from filed emails — not confirmed"}">${esc(l)}</span>`:""; }
let PORTAL_EDIT=false;
function renderPortal(){
  const el=document.getElementById("portal"); const p=CURRENT&&!CURRENT.allMode&&PROJECTS.find(x=>x.id===CURRENT.proj.id);
  if(!p){ el.style.display="none"; el.innerHTML=""; return; }
  el.style.display="flex";
  if(PORTAL_EDIT){
    const cur=p.platform||p.detected||"";
    el.innerHTML=`<b>CA platform</b>
      <label class="sr-only" for="pfPlat">Platform</label><select id="pfPlat" onchange="portalPlatChanged()">${["",...window.CaIntake.CA_PLATFORMS].map(x=>`<option value="${esc(x)}" ${x===cur?"selected":""}>${x?esc(x):"— choose —"}</option>`).join("")}</select>
      <label class="sr-only" for="pfUrl">Project link on the platform</label><input id="pfUrl" style="flex:1;min-width:240px" value="${esc(p.url)}" placeholder="${esc(PLATFORM_LINK_HINT[cur]||"https://…")}" ${cur==="Email only"?"disabled":""}>
      <label class="sr-only" for="pfGc">General contractor</label><input id="pfGc" style="width:200px" value="${esc(p.gc)}" placeholder="General contractor (e.g. Gilbane)">
      <button class="primary" onclick="savePortal()">Save</button><button class="ghost" onclick="PORTAL_EDIT=false;renderPortal()">Cancel</button>
      <div class="muted" style="flex-basis:100%;font-size:12px">The link is the project's own page on the platform (copy it from the address bar while signed in). Saved to this project in the PMS, and added to its External links. Never paste a password here.</div>`;
    return;
  }
  const counts=Object.entries(p.detectedCounts||{}).map(([k,v])=>`${v} ${k}`).join(", ");
  const open=p.url?`<a href="${esc(p.url)}" target="_blank" rel="noreferrer">Open in ${esc(p.platform||p.detected||"portal")} ↗</a>`:"";
  if(p.platform){
    el.innerHTML=`<span class="muted">CA platform</span> <span class="plat">${esc(p.platform)}</span>${p.gc?` <span>GC: <b>${esc(p.gc)}</b></span>`:""} ${open||(p.platform!=="Email only"?`<span class="muted">no link saved</span>`:"")}
      <span class="spacer" style="flex:1"></span><span class="muted" style="font-size:12px">${p.setBy?"set by "+esc(p.setBy):""}${p.setAt?" · "+esc(p.setAt.slice(0,10)):""}</span>
      <button class="ghost" style="font-size:12px" onclick="PORTAL_EDIT=true;renderPortal()">Edit</button>`;
  } else if(p.detected){
    el.innerHTML=`<span class="muted">CA platform</span> <span class="plat guess">${esc(p.detected)}?</span> <span class="muted" style="font-size:12px">guessed from filed emails (${esc(counts)}) — not confirmed</span>
      <span class="spacer" style="flex:1"></span><button class="primary" style="font-size:12px" onclick="PORTAL_EDIT=true;renderPortal()">Confirm…</button>`;
  } else {
    el.innerHTML=`<span class="muted">CA platform</span> <span class="muted">not set, and no portal emails filed</span><span class="spacer" style="flex:1"></span><button class="ghost" style="font-size:12px" onclick="PORTAL_EDIT=true;renderPortal()">Set platform</button>`;
  }
}
function portalPlatChanged(){ const v=document.getElementById("pfPlat").value, u=document.getElementById("pfUrl"); u.disabled=v==="Email only"; u.placeholder=PLATFORM_LINK_HINT[v]||"https://…"; }
async function savePortal(){
  const p=PROJECTS.find(x=>x.id===CURRENT.proj.id); if(!p) return;
  const platform=document.getElementById("pfPlat").value, gc=document.getElementById("pfGc").value.trim();
  let url=platform==="Email only"?"":document.getElementById("pfUrl").value.trim();
  if(!platform){ toast("Choose a platform",false); return; }
  if(url&&!/^https:\/\//i.test(url)){ toast("The link must start with https://",false); return; }
  const who=getWho(), at=new Date().toISOString();
  try{
    await writeProject(p.id, proj=>{
      const links=Array.isArray(proj.externalLinks)?proj.externalLinks.slice():[];
      const i=links.findIndex(l=>l&&l.caPortal);
      const link=url?{ ...(i>=0?links[i]:{id:"ca-portal-"+uid()}), type:["Autodesk Build","Newforma","PMWeb","Procore","Kahua"].includes(platform)?platform:"Other",
        label:platform+" (CA)", url, note:gc?"GC: "+gc:"", caPortal:true }:null;
      if(i>=0){ if(link) links[i]=link; else links.splice(i,1); } else if(link) links.push(link);
      return { ...proj, caPortal:{ platform, gc, by:who||null, at }, externalLinks:links };
    });
    Object.assign(p,{platform,gc,setBy:who,setAt:at,url});
    PORTAL_EDIT=false; renderPortal(); rebuildPicker(); toast("CA platform saved ✓",true);
  }catch(e){ toastErr(e); }
}
// Version-guarded read-modify-write of the whole project blob (writeArray's
// sibling for top-level fields): aborts cleanly if someone saved meanwhile.
async function writeProject(pid, mutate){
  const rows=await fetchJson(`pms_projects?id=eq.${pid}&select=id,project,version`);
  if(!rows.length) throw new Error("Project not found.");
  const updated=mutate(rows[0].project), ver=rows[0].version;
  const r=await fetch(SUPABASE_URL+`/rest/v1/pms_projects?id=eq.${pid}&version=eq.${ver}`,{
    method:"PATCH", headers:{...H,"Content-Type":"application/json","Prefer":"return=representation"},
    body:JSON.stringify({project:updated, version:ver+1, updated_at:new Date().toISOString()}) });
  const back=await r.json();
  if(!r.ok||!back.length){ const e=new Error("Project changed since you opened it (someone else saved). Reload the project and retry — nothing was written."); e.conflict=true; throw e; }
  return true;
}

/* ---- project picker: a searchable combobox ----
   One box: the selected project's label sits in it; focusing it opens the
   whole list, typing narrows the list by number, name, GC or platform, and
   Enter / click picks. Escape or clicking away puts the selected label back. */
const COMBO={ open:false, hi:-1, items:[], selectedId:"__ALL__" };
function comboLabel(p){ return p.id==="__ALL__" ? `★ All projects (${PROJECTS.length})` : `${p.number?p.number+" — ":""}${p.name}${platLabel(p)?" · "+platLabel(p):""}`; }
function comboItems(q){
  q=(q||"").toLowerCase().trim();
  const list=PROJECTS.filter(p=>!q||(p.number+" "+p.name+" "+platLabel(p)+" "+p.gc).toLowerCase().includes(q));
  return ((!q||"all projects".includes(q))?[{id:"__ALL__"}]:[]).concat(list);
}
function comboSelectedLabel(){ if(COMBO.selectedId==="__ALL__") return comboLabel({id:"__ALL__"}); const p=PROJECTS.find(x=>x.id===COMBO.selectedId); return p?comboLabel(p):""; }
function comboRender(q){
  const ul=document.getElementById("projList"), inp=document.getElementById("projInput");
  COMBO.items=comboItems(q); COMBO.hi=COMBO.items.length?0:-1;
  ul.innerHTML=COMBO.items.length
    ? COMBO.items.map((p,i)=>`<li role="option" id="projOpt${i}" aria-selected="${p.id===COMBO.selectedId}" onmousedown="event.preventDefault();comboPick(${i})">${esc(comboLabel(p))}</li>`).join("")
    : `<li class="muted" style="font-size:12px;cursor:default">No project matches "${esc(q)}"</li>`;
  ul.hidden=false; COMBO.open=true; inp.setAttribute("aria-expanded","true"); comboHiSync();
}
function comboHiSync(){
  const ul=document.getElementById("projList"), inp=document.getElementById("projInput");
  [...ul.children].forEach((li,i)=>li.classList.toggle("hi",i===COMBO.hi));
  if(COMBO.hi>=0) inp.setAttribute("aria-activedescendant","projOpt"+COMBO.hi); else inp.removeAttribute("aria-activedescendant");
  const li=ul.children[COMBO.hi]; if(li&&li.scrollIntoView) li.scrollIntoView({block:"nearest"});
}
function comboClose(restore){
  const ul=document.getElementById("projList"), inp=document.getElementById("projInput");
  ul.hidden=true; COMBO.open=false; inp.setAttribute("aria-expanded","false"); inp.removeAttribute("aria-activedescendant");
  if(restore) inp.value=comboSelectedLabel();
}
function comboPick(i){ const p=COMBO.items[i]; if(p) comboSelect(p.id); }
function comboSelect(id){
  COMBO.selectedId=id; const inp=document.getElementById("projInput");
  inp.value=comboSelectedLabel(); comboClose(false); inp.blur();
  selectProject(id);
}
function comboFocus(e){ e.target.select(); comboRender(""); }          // whole list; typing replaces the label
function comboInput(e){ comboRender(e.target.value); }
function comboBlur(){ setTimeout(()=>{ if(COMBO.open) comboClose(true); },120); }
function comboToggle(){ const inp=document.getElementById("projInput"); if(COMBO.open) comboClose(true); else inp.focus(); }
function comboKey(e){
  const inp=e.target;
  if(e.key==="ArrowDown"){ e.preventDefault(); if(!COMBO.open) comboRender(""); else if(COMBO.hi<COMBO.items.length-1){ COMBO.hi++; comboHiSync(); } }
  else if(e.key==="ArrowUp"){ e.preventDefault(); if(COMBO.open&&COMBO.hi>0){ COMBO.hi--; comboHiSync(); } }
  else if(e.key==="Enter"){ if(COMBO.open){ e.preventDefault(); if(COMBO.hi>=0) comboPick(COMBO.hi); } }
  else if(e.key==="Escape"){ if(COMBO.open){ e.preventDefault(); comboClose(true); } }
}
// Labels can change (a platform was confirmed): refresh what the box shows.
function rebuildPicker(){ const inp=document.getElementById("projInput"); if(inp&&!COMBO.open) inp.value=comboSelectedLabel(); }

async function selectAll(){
  document.getElementById("out").innerHTML=`<p class="empty">Loading all Construction-Admin projects…</p>`;
  try{
    const ids=PROJECTS.map(p=>p.id); if(!ids.length){ document.getElementById("out").innerHTML=`<p class="empty">No CA projects.</p>`; return; }
    const rows=await fetchJson(`pms_projects?id=in.(${ids.join(",")})&select=id,name:project->>name,number:project->>projectNumber,rfis:project->rfis,submittals:project->submittals,team:project->teamMembers,rfiDueDays:project->>rfiDueDays,submittalDueDays:project->>submittalDueDays`);
    const tag=(arr,row)=>(arr||[]).map(r=>({...r,__projId:row.id,__projName:row.name||"",__projNum:row.number||""}));
    const rfis=[], subs=[], teams={}, dueDays={};
    for(const row of rows){ rfis.push(...tag(row.rfis,row)); subs.push(...tag(row.submittals,row)); teams[row.id]=row.team||[]; dueDays[row.id]={rfi:+row.rfiDueDays||5, sub:+row.submittalDueDays||10}; }
    const byP=(a,b)=>String(a.__projNum||a.__projName).localeCompare(String(b.__projNum||b.__projName))||String(a.number).localeCompare(String(b.number));
    rfis.sort(byP); subs.sort(byP);
    CURRENT={ proj:{id:"__ALL__",name:"All Construction-Admin projects"}, allMode:true, rfis, submittals:subs, inbox:{rfi:[],submittal:[]}, teams, dueDays };
    renderProject();
  }catch(e){ document.getElementById("out").innerHTML=`<p class="err" role="alert">Load failed: ${esc(e.message)}</p>`; }
}
async function selectProject(pid){
  PORTAL_EDIT=false;
  if(pid==="__ALL__") return selectAll();
  const proj=PROJECTS.find(p=>p.id===pid); if(!proj)return;
  document.getElementById("out").innerHTML=`<p class="empty">Loading ${esc(proj.name)}…</p>`;
  try{
    const [projRows, emails]=await Promise.all([
      fetchJson(`pms_projects?id=eq.${pid}&select=rfis:project->rfis,submittals:project->submittals,team:project->teamMembers,rfiDueDays:project->>rfiDueDays,submittalDueDays:project->>submittalDueDays`),
      // Newforma closing notices ("Responded to and Closed", "Sent and Closed")
      // must come along with the forwards: without them every Newforma item
      // imports as open even when the filed log holds Setty's own response.
      fetchJson(`pms_project_emails?project_id=eq.${pid}&or=(from_address.ilike.*procoretech*,from_address.ilike.*forma*,subject.ilike.*RFI%20Forwarded*,subject.ilike.*Submittal%20Forwarded*,subject.ilike.*Responded%20to%20and%20Closed*,subject.ilike.*Sent%20and%20Closed*,from_address.ilike.*kahua*)&select=record_id,subject,from_name,email_date,body_text,sp_folder_url,from_address&order=email_date.asc`),
    ]);
    const logged=projRows[0]||{}; const loggedRFIs=logged.rfis||[], loggedSubs=logged.submittals||[];
    const CI=window.CaIntake; if(!CI) throw new Error("caIntake.js did not load — reload the page.");
    const inbox=CI.buildInbox(emails,loggedRFIs,loggedSubs,pid);
    CURRENT={ proj, rfis:loggedRFIs, submittals:loggedSubs, inbox, teams:{[pid]:(logged.team||[])}, dueDays:{[pid]:{rfi:+logged.rfiDueDays||5, sub:+logged.submittalDueDays||10}} };
    renderProject();
  }catch(e){ document.getElementById("out").innerHTML=`<p class="err" role="alert">Load failed: ${esc(e.message)}</p>`; }
}

/* =========================== FILTERS =========================== */
// The search box is static HTML (only #out re-renders), so typing never loses
// the caret; the re-render itself is debounced so each keystroke stays cheap.
let _textTimer=null;
function setF(k,v){
  if(k==="text"){ clearTimeout(_textTimer); _textTimer=setTimeout(()=>{ FILTER.text=v.toLowerCase(); renderProject(); },150); return; }
  FILTER[k]=v; syncFilterUi(); renderProject();
}
function syncFilterUi(){
  const g=id=>document.getElementById(id);
  g("fType").value=FILTER.type; g("fDisc").value=FILTER.disc; g("fStatus").value=FILTER.status; if(g("fText").value.toLowerCase()!==FILTER.text) g("fText").value=FILTER.text;
  g("fMine").setAttribute("aria-pressed",String(!!FILTER.mine)); g("fUnrev").setAttribute("aria-pressed",String(FILTER.status==="__unreviewed__"));
}
// Reset = back to the view the page opens on (open items), not "everything".
function clearFilters(){ FILTER=FILTER_DEFAULT(); syncFilterUi(); renderProject(); }
function toggleMine(){ if(!FILTER.mine&&!myIdentity()){ toast("Sign in so the Mine filter knows who you are.", false); return; } FILTER.mine=!FILTER.mine; syncFilterUi(); renderProject(); }
function toggleUnrev(){ FILTER.status=FILTER.status==="__unreviewed__"?"__open__":"__unreviewed__"; syncFilterUi(); renderProject(); }
// Who "me" is: the sign-in email and display name, matched against the
// project's team members by email, then by name.
function myIdentity(){ const email=String(window.settyAuth&&settyAuth.email&&settyAuth.email()||"").trim().toLowerCase(); const name=getWho().toLowerCase(); return (email||name)?{email,name}:null; }
function isMine(r){ const me=myIdentity(); if(!me) return false; const team=teamOf(r);
  return (r.assignedTo||[]).some(id=>{ const m=team.find(t=>t.id===id); if(!m) return false;
    return (me.email&&String(m.email||"").trim().toLowerCase()===me.email)||(me.name&&String(m.name||"").trim().toLowerCase()===me.name); }); }
function passFilter(r){
  if(FILTER.mine&&!isMine(r)) return false;
  if(FILTER.disc==="__unset__"){ if((r.discipline||"")!=="") return false; }
  else if(FILTER.disc!=="all" && (r.discipline||"")!==FILTER.disc) return false;
  if(FILTER.status==="__open__"){ if(!OPEN_STATUSES.includes(r.status||"")) return false; }
  else if(FILTER.status==="__unreviewed__"){ if(!isUnreviewed(r)) return false; }
  else if(FILTER.status!=="all" && (r.status||"")!==FILTER.status) return false;
  if(FILTER.text){ const hay=((r.number||"")+" "+(r.title||"")+" "+(r.description||"")+" "+(r.specSection||"")+" "+(r.from||"")+" "+(r.__projNum||"")+" "+(r.__projName||"")).toLowerCase(); if(!hay.includes(FILTER.text)) return false; }
  return true;
}

/* =========================== RENDER =========================== */
// Unreviewed = appended by the connector's scheduled intake (intakeReviewed:false)
// and not yet confirmed by a person. Same rule as the main PMS: badged, and not
// counted as overdue until confirmed.
function isUnreviewed(r){ return !!r && r.intakeReviewed===false; }
function isOpenItem(kind, r){ return (kind==="rfi"?RFI_OPEN:SUB_OPEN).includes((r&&r.status)||""); }
// Due-date urgency — thresholds mirror the main PMS slaState (SLA_DUE_SOON_DAYS = 2).
function dueState(kind, r){
  if(!isOpenItem(kind,r)||isUnreviewed(r)) return null;
  const n=daysUntil(r.dueDate); if(n===null) return null;
  if(n<0) return {cls:"late",label:"Overdue "+(-n)+"d"};
  if(n===0) return {cls:"late",label:"Due today"};
  if(n<=2) return {cls:"soon",label:"Due in "+n+"d"};
  return {cls:"ok",label:"Due in "+n+"d"};
}
function dueChip(kind, r){ const s=dueState(kind,r); return s?`<span class="due ${s.cls}">${s.label}</span>`:""; }
function unrevBadge(r){ return isUnreviewed(r)?` <span class="badge unrev" title="Logged automatically from ${esc((r.intake&&r.intake.vendor)||"a portal email")} — open it, check discipline / assignee / dates, then Confirm. Not counted as overdue until confirmed.">Unreviewed</span>`:""; }
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// "Oct 22" (year only when it isn't this year); the ISO date stays in the tooltip and the CSV.
function fmtDate(iso){ if(!/^\d{4}-\d{2}-\d{2}/.test(iso||"")) return iso||"—"; const y=+iso.slice(0,4), m=+iso.slice(5,7), d=+iso.slice(8,10); return MONTHS[m-1]+" "+d+(y!==new Date().getFullYear()?", "+y:""); }
function dateCell(iso, extra){ return `<td class="date" title="${esc(iso||"")}">${esc(fmtDate(iso))}${extra||""}</td>`; }
// Display order: open items first, soonest due first (no due date last); then
// closed items, most recently received first. All-projects mode keeps rows
// grouped by project.
// Column sort: click a heading for ascending, again for descending, a third
// time for the default order. Rows stay grouped by project in all-projects mode.
const SORT={rfi:null, submittal:null};
const SORT_COLS={ number:r=>String(r.number||""), title:r=>String(r.title||r.description||""), description:r=>String(r.description||r.title||""), discipline:r=>String(r.discipline||""),
  from:r=>String(r.from||""), assigned:r=>assigneeNames(r), stamp:r=>String(r.stamp&&r.stamp!=="—"?r.stamp:""), received:r=>String(r.dateReceived||""), due:r=>String(r.dueDate||"9999"), status:r=>String(r.status||"") };
function sortBy(kind,key){ const cur=SORT[kind]; SORT[kind]=(!cur||cur.key!==key)?{key,dir:1}:cur.dir===1?{key,dir:-1}:null; renderProject(); }
function sortTh(kind,key,label){ const cur=SORT[kind]; const on=cur&&cur.key===key;
  return `<th scope="col" class="sortable"${on?` aria-sort="${cur.dir===1?"ascending":"descending"}"`:""}><button type="button" onclick="sortBy('${kind}','${key}')" title="${on?(cur.dir===1?"Sorted ascending — click for descending":"Sorted descending — click for the default order"):"Sort by "+esc(label)}">${esc(label)}${on?(cur.dir===1?" ▲":" ▼"):""}</button></th>`; }
function sortForDisplay(kind, rows){
  const am=CURRENT&&CURRENT.allMode; const dk=r=>{const n=daysUntil(r.dueDate); return n===null?1e9:n;};
  const grp=(a,b)=>am?String(a.__projNum||a.__projName||"").localeCompare(String(b.__projNum||b.__projName||"")):0;
  const col=SORT[kind];
  if(col&&SORT_COLS[col.key]){ const g=SORT_COLS[col.key]; return rows.slice().sort((a,b)=>grp(a,b)||col.dir*g(a).localeCompare(g(b),undefined,{numeric:true,sensitivity:"base"})||String(a.number||"").localeCompare(String(b.number||""))); }
  return rows.slice().sort((a,b)=>
    grp(a,b) ||
    (isOpenItem(kind,b)?1:0)-(isOpenItem(kind,a)?1:0) ||
    (isOpenItem(kind,a) ? dk(a)-dk(b) : String(b.dateReceived||"").localeCompare(String(a.dateReceived||""))) ||
    String(a.number||"").localeCompare(String(b.number||"")));
}
// Pill colours live in CSS (.pill.st-<status>) so the light theme can restyle them.
function statusPill(s){ const slug=String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-"); return `<span class="pill${slug?" st-"+slug:""}">${esc(s||"—")}</span>`; }
function teamOf(r){ return (CURRENT.teams&&CURRENT.teams[r.__projId||CURRENT.proj.id])||[]; }
function assigneeNames(r){ const team=teamOf(r); const names=(r.assignedTo||[]).map(id=>{const m=team.find(t=>t.id===id);return m?(m.name||m.role):null;}).filter(Boolean); let s=names.join(", "); if(r.subAssigned) s+=(s?" · ":"")+"sub: "+r.subAssigned; return s; }
function csvCell(v){ v=String(v==null?"":v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCSV(kind){
  const rows=sortForDisplay(kind,(kind==="rfi"?CURRENT.rfis:CURRENT.submittals).filter(passFilter)); const am=CURRENT.allMode;
  const cols = kind==="rfi"
    ? [["Project",r=>r.__projNum||r.__projName],["RFI #",r=>r.number],["Title",r=>r.title],["Discipline",r=>r.discipline],["From",r=>r.from],["Assigned",r=>assigneeNames(r)],["Received",r=>r.dateReceived],["Due",r=>r.dueDate],["Responded",r=>r.dateResponded],["Status",r=>r.status],["Response",r=>r.response],["Notes",r=>r.notes]]
    : [["Project",r=>r.__projNum||r.__projName],["Submittal #",r=>r.number],["Spec",r=>r.specSection],["Description",r=>r.description],["Discipline",r=>r.discipline],["Assigned",r=>assigneeNames(r)],["Stamp",r=>r.stamp],["Received",r=>r.dateReceived],["Due",r=>r.dueDate],["Returned",r=>r.dateReturned],["Status",r=>r.status],["Comments",r=>r.comments],["Notes",r=>r.notes]];
  const use = am?cols:cols.filter(c=>c[0]!=="Project");
  const lines=[use.map(c=>csvCell(c[0])).join(",")];
  for(const r of rows) lines.push(use.map(c=>csvCell(c[1](r))).join(","));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`${kind==="rfi"?"RFIs":"Submittals"}_${String(CURRENT.proj.number||CURRENT.proj.name||"all").replace(/[^\w.-]+/g,"_")}_${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function renderProject(){
  renderPortal();
  const out=document.getElementById("out"); out.innerHTML=""; document.getElementById("filterbar").style.display="flex";
  let total=0, shownTot=0;
  if(FILTER.type!=="submittal"){ const s=renderSection("rfi","RFIs",CURRENT.rfis,CURRENT.inbox.rfi); out.appendChild(s.el); total+=s.total; shownTot+=s.shown; }
  if(FILTER.type!=="rfi"){ const s=renderSection("submittal","Submittals",CURRENT.submittals,CURRENT.inbox.submittal); out.appendChild(s.el); total+=s.total; shownTot+=s.shown; }
  const d=FILTER_DEFAULT(); const filtered=Object.keys(d).some(k=>FILTER[k]!==d[k]);
  document.getElementById("filterCount").textContent = filtered? `showing ${shownTot} of ${total}` : "";
}
function renderSection(kind, title, logged, inbox){
  const sec=document.createElement("section"); sec.className="sec";
  const news=inbox.filter(i=>i.verdict==="new");
  const shown=sortForDisplay(kind, logged.filter(passFilter));
  const am=CURRENT.allMode;
  const late=logged.filter(r=>{const s=dueState(kind,r);return s&&s.cls==="late"&&daysUntil(r.dueDate)<0;}).length, unrev=logged.filter(isUnreviewed).length;
  let html=`<div class="head"><h2>${title}</h2><span class="count">${shown.length===logged.length?logged.length:shown.length+" of "+logged.length} logged${late?` · <span class="late">${late} overdue</span>`:""}${unrev?` · <span class="unrev">${unrev} unreviewed</span>`:""}${news.length?` · ${news.length} to import`:""}</span><span class="spacer"></span>`+
    `<button class="ghost" style="font-size:12px" onclick="exportCSV('${kind}')">⬇ CSV</button>`+
    (am?`<span class="muted" style="font-size:12px">pick one project to add / import</span>`:
       `<a href="${esc(caBackloadSeatUrl(kind, CURRENT.proj.name||"", CURRENT.proj.number||""))}" target="_blank" rel="noreferrer" title="For items still in Newforma: open a Claude seat to find the filed PDF / notification email, log it here (backfill), then review it against the current set and specs." style="font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;color:var(--accent);font-weight:600">🤖 Log from filed PDF/email</a>`+
       `<button class="primary" onclick="openEditor('${kind}',null)">+ Add ${kind==='rfi'?'RFI':'Submittal'}</button>`)+`</div>`;
  if(news.length){
    const head = kind==="rfi" ? "<th scope='col'>RFI</th><th scope='col'>Title</th><th scope='col'>Status</th><th scope='col'>Due</th><th scope='col'>Asked by</th><th scope='col'>Discipline</th><th scope='col' class='right'>Import</th>"
                              : "<th scope='col'>Item</th><th scope='col'>Title</th><th scope='col'>Spec</th><th scope='col'>Status</th><th scope='col'>Due</th><th scope='col'>Discipline</th><th scope='col' class='right'>Import</th>";
    const vocab = kind==="rfi"?RFI_DISC:SUB_DISC;
    const rows=inbox.map(it=>{ const stale=isStaleImport(it);
      const cb=it.verdict==="new"?`<input type="checkbox" class="pick" aria-label="Import ${kind==="rfi"?"RFI":"submittal"} #${esc(it.extNum)}" data-k="${kind}" data-ext="${esc(it.extNum)}" ${stale?"":"checked"}>`:"";
      const dv=(it.record&&it.record.discipline)||"";
      const dcell = it.verdict==="new"
        ? `<td><select class="discSel" data-k="${kind}" data-ext="${esc(it.extNum)}" aria-label="Discipline for #${esc(it.extNum)}" title="Discipline — inferred from spec section / title; pick one before import" onchange="this.removeAttribute('aria-invalid')"><option value="" ${dv?"":"selected"}>—</option>${vocab.map(d=>`<option ${d===dv?"selected":""}>${esc(d)}</option>`).join("")}</select></td>`
        : `<td class="muted">${esc(dv||"—")}</td>`;
      const c = kind==="rfi" ? `<td class="num">#${esc(it.extNum)}</td><td class="title">${esc(it.title)}</td><td>${statusPill(it.status)}</td>${dateCell(it.dueDate)}<td>${esc(it.from||"")}</td>`
        : `<td class="num">#${esc(it.extNum)}${it.rev?` <span class=muted>r${it.rev}</span>`:""}</td><td class="title">${esc(it.title)}</td><td>${esc(it.specSection||"")}</td><td>${statusPill(it.status)}</td>${dateCell(it.dueDate)}`;
      return `<tr>${c}${dcell}<td class="right">${verdictBadge(it)}${stale?` <span class="badge old" title="Latest portal email is ${-daysUntil(it.lastDate)} days old. Only the assignment email is on file, so the log cannot tell whether it was ever answered — it would import as ${esc(it.status)} with no way to know. Tick it only if it really is still open.">old · status unknown</span>`:""} ${cb}</td></tr>`; }).join("");
    const staleCount=news.filter(isStaleImport).length;
    html+=`<div class="inbox"><div class="ihead"><span>📥 To import from portal emails (Procore / Forma / Newforma / Kahua) — ${news.length} new</span>`+
      `<div class="legend"><span><span class="badge new">NEW</span> not yet logged</span><span><span class="badge matched">matched</span> already logged</span><span><span class="badge update">UPDATE</span> newer revision — review by hand</span></div></div>`+
      `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`+
      `<div class="actions"><button class="primary" onclick="importSelected('${kind}')">Import selected → log</button><span class="muted" style="font-size:12px">Tick the new ones, then import. Already-logged items are skipped.${staleCount?` <b>${staleCount} unticked</b>: their latest portal email is over ${STALE_IMPORT_DAYS} days old and no closing notice is on file, so they would import as open with no way to know. Tick those only if they really are still open.`:""}</span></div></div>`;
  }
  if(!logged.length){ html+=`<div class="empty">No ${kind}s logged yet. Click “+ Add ${kind==='rfi'?'RFI':'Submittal'}” to log one, or import from the portal emails above.</div>`; }
  else {
    const T=(k,l)=>sortTh(kind,k,l);

    // All-projects mode: one header row per project (click it to open that

    let lastProj=null;
    const rows=shown.map(r=>{
      let pc="";
      if(am&&r.__projId!==lastProj){ lastProj=r.__projId; const pp=PROJECTS.find(x=>x.id===r.__projId); const n=perProj[r.__projId];
        pc=`<tr class="grp"><td colspan="8"><button type="button" class="rowbtn" onclick="pickProject(${esc(JSON.stringify(r.__projId))})" title="Open this project">${esc(r.__projNum?r.__projNum+" — ":"")}${esc(r.__projName||r.__projNum||"(unnamed)")}</button>${pp?platTagHtml(pp):""} <span class="muted" style="font-weight:400">· ${n} item${n===1?"":"s"}</span></td></tr>`; }
      const asg=esc(assigneeNames(r));
      const open=`openEditor("${kind}",${esc(JSON.stringify(r.id))})`;
      // Keyboard path: real button on the number cell (stopPropagation so the
      // row's mouse-convenience onclick doesn't fire the editor twice).
      const numBtn=`<button type="button" class="rowbtn" aria-label="Open ${kind==="rfi"?"RFI":"submittal"} ${esc(r.number||"(no number)")}" onclick='event.stopPropagation();${open}'>${esc(r.number||"—")}</button>`;
      const aiMark=r.aiReview?` <span title="Claude review waiting for sign-off — open to review" style="font-size:11px" role="img" aria-label="Claude review pending">🤖</span>`:"";
      const ds=dueState(kind,r); const lateRow=ds&&ds.cls==="late"?" late":"";
      const c = kind==="rfi"
        ? `<td class="num">${numBtn}</td><td class="title">${esc(r.title||r.description||"—")}${aiMark}</td><td>${r.discipline?esc(r.discipline):'<span class="muted">not set</span>'}</td><td>${esc(r.from||"")}</td><td>${asg||'<span class="muted">—</span>'}</td>${dateCell(r.dateReceived)}${dateCell(r.dueDate, dueChip(kind,r))}<td>${statusPill(r.status)}${unrevBadge(r)}</td>`
        : `<td class="num">${numBtn}</td><td class="title">${esc(r.description||r.title||"—")}${aiMark}<div class="muted" style="font-size:11px">${esc(r.specSection||"")}</div></td><td>${r.discipline?esc(r.discipline):'<span class="muted">not set</span>'}</td><td>${asg||'<span class="muted">—</span>'}</td><td>${esc(r.stamp&&r.stamp!=="—"?r.stamp:"")}</td>${dateCell(r.dateReceived)}${dateCell(r.dueDate, dueChip(kind,r))}<td>${statusPill(r.status)}${unrevBadge(r)}</td>`;
      const nw=JUST_IMPORTED.has(r.id)?" justnew":"";

/* The review travels with the item when it goes out for review: the assign
   draft carries Claude's suggestion, the internal notes, and the reference

function caAiEmailText(includeInternal){
  const ai=EDIT&&EDIT.ai; if(!ai) return "";
  const links=Array.isArray(ai.docLinks)?ai.docLinks.filter(l=>l&&/^https:\/\//i.test(l.url)):[];
  let t="\n--- Claude review (suggestions pending sign-off in the PMS) ---\n";
  if(ai.reviewedAgainstSet) t+="Reviewed against: "+ai.reviewedAgainstSet+"\n";

  if(EDIT.kind!=="rfi"&&ai.suggestedStamp) t+="\nSuggested stamp: "+ai.suggestedStamp+"\n";

async function saveEditor(){
  if(!EDIT)return; const {kind,isNew,id}=EDIT; const arrKey=kind==="rfi"?"rfis":"submittals";
  if(!validateEditor(kind)){ EDIT.confirmIntake=false; return; }
  const edits=collectEdits(kind); const who=getWho(); const now=new Date().toISOString();
  edits.syncEditedBy=who||"(unknown)"; edits.syncEditedAt=now;
  if(EDIT.sheetRefsWork) edits.sheetRefs=EDIT.sheetRefsWork; // chip decisions ride the save
  clearUndoBar(); // any other edit makes a blind import-undo unsafe
  try{
    await writeArray(arrKey, arr=>{
      if(isNew){ const base=kind==="rfi"?blankRFI():blankSub(); return [...arr, {...base, ...edits, id:uid(), loggedBy:who||"(unknown)", loggedAt:now}]; }
      return arr.map(r=>{ if(r.id!==id) return r; const m={...r, ...edits};
        if(EDIT.confirmIntake&&isUnreviewed(m)){ m.intakeReviewed=true; m.intake={...(m.intake||{}), reviewedAt:now, reviewedBy:who||null}; }
        // Dismiss removes ONLY the review the user actually saw. writeArray re-reads
        // the project at save time, so a re-review saved after this modal opened is
        // present here with a newer aiReview.at — deleting unconditionally would
        // silently discard that fresh output. Match on .at before removing.
        if(EDIT.dismissAi && m.aiReview && (!EDIT.ai || m.aiReview.at===EDIT.ai.at)) delete m.aiReview;
        return m; });
    }, false, EDIT.projId);
    const confirmed=EDIT.confirmIntake;
    closeEditor(); toast(isNew?"Added to log ✓":confirmed?"Confirmed and saved ✓":"Saved ✓", true); selectProject(CURRENT.proj.id);
  }catch(err){ if(EDIT) EDIT.confirmIntake=false; toastErr(err); }
}
async function deleteRecord(){
  if(!EDIT||EDIT.isNew)return; const {kind,id,projId}=EDIT; const arrKey=kind==="rfi"?"rfis":"submittals";
  const rec=(kind==="rfi"?CURRENT.rfis:CURRENT.submittals).find(r=>r.id===id);

/* =========================== IMPORT (sync) =========================== */
let JUST_IMPORTED=new Set(); // ids added by the most recent import (row highlight; ids embed the project id, so no cross-project bleed)
let UNDO=null;               // {arrKey, ids, projId, record?, timer} — one-shot revert window for the last import or delete

async function importSelected(kind){
  const arrKey=kind==="rfi"?"rfis":"submittals"; const inbox=CURRENT.inbox[kind];
  // Apply the preview's per-row Discipline choices onto the records before import.
  document.querySelectorAll(`.discSel[data-k="${kind}"]`).forEach(sel=>{
    const it=inbox.find(i=>String(i.extNum)===sel.dataset.ext);
    if(it&&it.record) it.record.discipline=sel.value;
  });
  const picked=new Set([...document.querySelectorAll(`.pick[data-k="${kind}"]:checked`)].map(c=>c.dataset.ext));
  const records=inbox.filter(i=>i.verdict==="new"&&picked.has(i.extNum)).map(i=>i.record);
  if(!records.length){ toast("Nothing selected.", false); return; }
  // A blank discipline would import as an empty cell nobody notices — ask for it now.
  const missing=[...document.querySelectorAll(`.discSel[data-k="${kind}"]`)].filter(sel=>picked.has(sel.dataset.ext)&&!sel.value);
  if(missing.length){ missing.forEach(sel=>sel.setAttribute("aria-invalid","true")); missing[0].focus();
    toast(`Pick a discipline for ${missing.length} ticked item${missing.length===1?"":"s"} before importing (or untick ${missing.length===1?"it":"them"}).`, false); return; }
  if(!confirm(`Import ${records.length} ${kind}(s) into the log?\n\nExisting records are not modified.`)) return;
  try{
    let addedIds=[];
    const added = await writeArray(arrKey, arr=>{ const have=new Set(arr.map(r=>r.id)); const add=records.filter(r=>!have.has(r.id)); arr._added=add.length; addedIds=add.map(r=>r.id); return [...arr,...add]; }, true);
    JUST_IMPORTED=new Set(addedIds);
    showUndoBar(arrKey, addedIds, CURRENT.proj.id);
    toast(`Imported ${added} ${kind}(s) ✓`, true); selectProject(CURRENT.proj.id);
  }catch(err){ toastErr(err); }
}

function showUndoBar(arrKey, ids, projId, opts){
  clearUndoBar();
  if(!ids.length) return;
  const o=opts||{};
  UNDO={arrKey, ids, projId, record:o.record||null, timer:setTimeout(clearUndoBar, 60000)};
  const bar=document.getElementById("undobar");
  bar.innerHTML=`<span>${esc(o.label||`Imported ${ids.length} — highlighted in the log below.`)}</span>`+
    `<button class="ghost" style="font-size:12px" onclick="undoLast()">↩ ${esc(o.undoLabel||"Undo this import")}</button>`;
  bar.classList.add("show");
}
function clearUndoBar(){
  if(UNDO&&UNDO.timer) clearTimeout(UNDO.timer);
  UNDO=null;
  const bar=document.getElementById("undobar");
  bar.classList.remove("show"); bar.innerHTML="";
}
async function undoLast(){
  if(!UNDO) return; const {arrKey,ids,projId,record}=UNDO; const idSet=new Set(ids);
  try{
    // Same version-guarded path as the import / delete — a concurrent save
    // aborts with the standard conflict message and nothing changes.
    if(record){
      await writeArray(arrKey, arr=>arr.some(r=>r.id===record.id)?arr:[...arr, record], false, projId);
      clearUndoBar(); toast(`Restored ${record.number||""} ✓`, true);
    } else {
      await writeArray(arrKey, arr=>arr.filter(r=>!idSet.has(r.id)), false, projId);
      JUST_IMPORTED.clear(); clearUndoBar(); toast(`Import undone — ${ids.length} removed ✓`, true);
    }
    selectProject(CURRENT.proj.id);
  }catch(err){ toastErr(err); }
}

/* =========================== WRITE (version-guarded, mirrors saveProjectV2) =========================== */
async function writeArray(arrKey, mutate, returnAdded, projId){
  const pid=projId||CURRENT.proj.id;
  const rows=await fetchJson(`pms_projects?id=eq.${pid}&select=id,project,version`);
  if(!rows.length) throw new Error("Project not found.");
  const proj=rows[0].project, ver=rows[0].version;
  const cur=(proj[arrKey]||[]).slice(); cur._added=0;
  const next=mutate(cur); const added=cur._added||0;
  const updated={...proj, [arrKey]:next};
  const r=await fetch(SUPABASE_URL+`/rest/v1/pms_projects?id=eq.${pid}&version=eq.${ver}`,{
    method:"PATCH", headers:{...H,"Content-Type":"application/json","Prefer":"return=representation"},
    body:JSON.stringify({project:updated, version:ver+1, updated_at:new Date().toISOString()}) });
  const back=await r.json();
  if(!r.ok||!back.length){ const e=new Error("Project changed since you opened it (someone else saved). Reload the project and retry — nothing was written."); e.conflict=true; throw e; }
  return returnAdded?added:true;
}

function reportOpts(){ const v=id=>document.getElementById(id); return {pm:v("rpPM").value, rfi:v("rpRfi").checked, sub:v("rpSub").checked, open:v("rpOpen").checked, over:v("rpOver").checked}; }
function reportRows(o){
  const rows=REPORT.items.filter(it=>{
    if(it.kind==="rfi"&&!o.rfi) return false; if(it.kind==="submittal"&&!o.sub) return false;
    if(o.pm==="__none__"){ if(it.pm) return false; } else if(o.pm!=="__all__"&&it.pm!==o.pm) return false;
    if(o.open&&!it.open) return false;
    if(o.over){ const n=daysUntil(it.rec.dueDate); if(!(it.open&&n!==null&&n<0)) return false; }
    return true; });
  // PM → project → most urgent due date first (no due date last).
  const dk=it=>{ const n=daysUntil(it.rec.dueDate); return n===null?1e9:n; };
  return rows.sort((a,b)=>a.pm.localeCompare(b.pm)||(a.projNum||a.projName).localeCompare(b.projNum||b.projName)||dk(a)-dk(b)||String(a.rec.number||"").localeCompare(String(b.rec.number||"")));
}
function reportPreview(){
  const o=reportOpts(); try{ localStorage.setItem("rfiTrackReportPM", o.pm); }catch(e){}
  const rows=reportRows(o); const over=rows.filter(it=>it.open&&(daysUntil(it.rec.dueDate)??0)<0).length;
  document.getElementById("rpCount").innerHTML=`<b>${rows.length}</b> item${rows.length===1?"":"s"} · <span style="color:${over?"var(--late)":"inherit"}">${over} overdue</span> · ${new Set(rows.map(r=>r.projId)).size} project(s)`;
}
function reportPMLabel(o){ return o.pm==="__all__"?"All PMs":o.pm==="__none__"?"No PM set":o.pm; }
function reportFileStem(o){ return `OpenItems_${reportPMLabel(o).replace(/[^\w.-]+/g,"_")}_${localISO(new Date())}`; }
function reportCSV(){
  const o=reportOpts(); const rows=reportRows(o);
  if(!rows.length){ toast("Nothing to export with these filters",false); return; }
  // =HYPERLINK makes the link clickable when the CSV opens in Excel/Sheets.
  const hl=(url,label)=>url?`=HYPERLINK("${url.replace(/"/g,'""')}","${String(label||"Open").replace(/"/g,'""')}")`:"";
  const cols=[["PM",it=>it.pm],["Project #",it=>it.projNum],["Project",it=>it.projName],["Platform",it=>it.platform],["Type",it=>it.kind==="rfi"?"RFI":"Submittal"],["Number",it=>it.rec.number],
    ["Title / Description",it=>it.kind==="rfi"?(it.rec.title||it.rec.description):(it.rec.description||it.rec.title)],["Spec",it=>it.rec.specSection||""],
    ["Assigned To",it=>it.assigned],["Received",it=>it.rec.dateReceived],["Due",it=>it.rec.dueDate],["Due Status",it=>it.open?dueLabel(it.rec):"—"],["Status",it=>it.rec.status],
    ["PMS Link",it=>hl(pmsItemLink(it.projId,it.kind,it.rec.number),"Open "+(it.rec.number||""))],["SharePoint Folder",it=>/^https?:/i.test(it.rec.spFolderUrl||"")?hl(it.rec.spFolderUrl,"Files"):""]];
  const lines=[cols.map(c=>csvCell(c[0])).join(",")];
  for(const it of rows) lines.push(cols.map(c=>csvCell(c[1](it))).join(","));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=reportFileStem(o)+".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function reportPrint(){
  const o=reportOpts(); const rows=reportRows(o);
  if(!rows.length){ toast("Nothing to report with these filters",false); return; }
  const w=window.open("","_blank"); if(!w){ toast("Pop-up blocked — allow pop-ups for this page, or use CSV",false); return; }
  const over=rows.filter(it=>it.open&&(daysUntil(it.rec.dueDate)??0)<0).length;
  const scope=[o.rfi&&"RFIs",o.sub&&"Submittals"].filter(Boolean).join(" & ")+(o.over?" — overdue only":o.open?" — open items":" — all statuses");
  const groups=[]; for(const it of rows){ const k=it.pm+"\u0000"+it.projId; let g=groups[groups.length-1]; if(!g||g.k!==k){ g={k,it,rows:[]}; groups.push(g); } g.rows.push(it); }
  const body=groups.map(g=>{
    const tr=g.rows.map(it=>{ const r=it.rec, n=daysUntil(r.dueDate), late=it.open&&n!==null&&n<0, soon=it.open&&n!==null&&n>=0&&n<=3;
      const link=pmsItemLink(it.projId,it.kind,r.number); const num=esc(r.number||"—");
      const title=it.kind==="rfi"?(r.title||r.description):(r.description||r.title);
      const files=/^https?:/i.test(r.spFolderUrl||"")?`<a href="${esc(r.spFolderUrl)}" target="_blank" rel="noreferrer">Files</a>`:"";
      return `<tr class="${late?"late":soon?"soon":""}"><td>${it.kind==="rfi"?"RFI":"Submittal"}</td><td class="num">${link?`<a href="${esc(link)}" target="_blank" rel="noreferrer">${num}</a>`:num}</td><td>${esc(title||"—")}${r.specSection?`<div class="dim">${esc(r.specSection)}</div>`:""}</td><td>${esc(it.assigned)}</td><td>${esc(r.dateReceived||"—")}</td><td>${esc(r.dueDate||"—")}</td><td class="due">${it.open?esc(dueLabel(r)):"—"}</td><td>${esc(r.status||"—")}</td><td>${files}</td></tr>`; }).join("");
    return `<h2>${esc(g.it.projNum?g.it.projNum+" — ":"")}${esc(g.it.projName)} <span class="dim">· PM: ${esc(g.it.pm||"(none)")}${g.it.platform?` · ${g.it.portalUrl?`<a href="${esc(g.it.portalUrl)}" target="_blank" rel="noreferrer">${esc(g.it.platform)}</a>`:esc(g.it.platform)}`:""} · ${g.rows.length} item${g.rows.length===1?"":"s"}</span></h2>
      <table><thead><tr><th>Type</th><th>#</th><th>Title / Description</th><th>Assigned to</th><th>Received</th><th>Due</th><th>Due status</th><th>Status</th><th>Files</th></tr></thead><tbody>${tr}</tbody></table>`; }).join("");
  const title=`Open RFIs & Submittals — ${reportPMLabel(o)}`;
  w.document.write(`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${esc(reportFileStem(o))}</title><style>
    body{font:12px/1.4 system-ui,Segoe UI,sans-serif;color:#111;margin:24px;background:#fff}
    h1{font-size:18px;margin:0 0 4px} h2{font-size:13px;margin:18px 0 6px;color:#1F3864;break-after:avoid} .dim{color:#666;font-weight:400;font-size:11px}
    .sum{margin:6px 0 4px} .sum b.late{color:#b91c1c}
    table{width:100%;border-collapse:collapse;margin-bottom:6px} th,td{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top} th{background:#eef2f7;font-size:11px}
    tr{break-inside:avoid} td.num{white-space:nowrap;font-weight:700} td.due{white-space:nowrap}
    tr.late td{background:#fdecec} tr.late td.due{color:#b91c1c;font-weight:700} tr.soon td.due{color:#b45309;font-weight:600}
    a{color:#1d4ed8} .bar{margin:10px 0} @media print{.bar{display:none} body{margin:10mm}}
  </style></head><body>
    <h1>${esc(title)}</h1>
    <div class="dim">${esc(scope)} · generated ${esc(new Date().toLocaleString())}${getWho()?" by "+esc(getWho()):""}</div>
    <div class="sum"><b>${rows.length}</b> item${rows.length===1?"":"s"} across ${new Set(rows.map(r=>r.projId)).size} project(s) · <b class="${over?"late":""}">${over} overdue</b></div>
    <div class="bar"><button onclick="window.print()">🖨 Print / Save as PDF</button></div>
    ${body}
  </body></html>`);
  w.document.close();
}

// init needs caIntake.js (platform detection); module scripts run after this
// one, so wait for it, but never hang the page on a failed load.
const caIntakeReady = new Promise(res => { if (window.CaIntake) return res(); window.addEventListener("caintake-ready", res, { once: true }); setTimeout(res, 5000); });
Promise.all([settyAuthReady, caIntakeReady]).then(init);
